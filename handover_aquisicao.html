<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handover , 99Abastece Relaunch SP</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --amarelo: #FFD600; --preto: #1A1A1A; --cinza-escuro: #232323; --cinza-medio: #2C2C2C;
  --branco: #FFFFFF; --texto-claro: #9A9A9A; --borda: #3A3A3A;
  --verde: #00C853; --vermelho: #FF5252; --laranja: #FFA726; --radius: 10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Montserrat',sans-serif;font-size:13px;background:var(--preto);color:var(--branco);min-height:100vh;}
.topbar{background:var(--amarelo);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.topbar-brand{display:flex;align-items:center;gap:10px;}
.topbar-logo{width:34px;height:34px;background:var(--preto);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--amarelo);}
.topbar-title{font-weight:800;font-size:16px;color:var(--preto);line-height:1.1;}
.topbar-sub{font-size:11px;font-weight:600;color:rgba(0,0,0,.55);}
.topbar-voltar{background:var(--preto);color:var(--amarelo);border:none;border-radius:8px;padding:8px 14px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;cursor:pointer;text-decoration:none;}

.container{max-width:900px;margin:0 auto;padding:20px 24px 60px;}

.card{background:var(--cinza-escuro);border:1.5px solid var(--borda);border-left:5px solid var(--laranja);border-radius:var(--radius);padding:22px 26px;margin-bottom:16px;}
.card.status-validado{border-left-color:var(--verde);}
.card.status-rejeitado{border-left-color:var(--vermelho);}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
.card-posto{font-weight:800;font-size:15px;}
.card-status{font-size:10px;font-weight:800;padding:3px 10px;border-radius:12px;background:var(--cinza-medio);white-space:nowrap;}
.card.status-validado .card-status{background:#0F2E20;color:var(--verde);}
.card-meta{font-size:11px;color:var(--texto-claro);margin-bottom:2px;}
.card-meta b{color:var(--branco);}

.btn-acao{margin-top:14px;width:100%;background:var(--amarelo);color:var(--preto);border:none;border-radius:8px;padding:11px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:12.5px;cursor:pointer;}
.btn-acao:disabled{opacity:.5;cursor:not-allowed;}

.upload-box{margin-top:14px;}
.upload-box input[type=file]{width:100%;background:var(--cinza-medio);border:1.5px solid var(--borda);border-radius:8px;color:var(--branco);font-family:'Montserrat',sans-serif;font-size:12px;padding:9px 10px;margin-bottom:10px;}

.gemini-fyi{margin-top:8px;background:var(--cinza-medio);border-radius:8px;padding:9px 12px;font-size:11.5px;color:var(--texto-claro);}
.aviso-aguardando{margin-top:10px;font-size:11px;color:var(--texto-claro);font-style:italic;}
.btn-acao-secundario{width:100%;background:none;border:1.5px solid var(--borda);color:var(--texto-claro);border-radius:8px;padding:9px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:11.5px;cursor:pointer;}
.btn-acao-secundario:disabled{opacity:.5;cursor:not-allowed;}

.empty{text-align:center;padding:50px 20px;color:var(--texto-claro);}
.empty-icon{font-size:30px;margin-bottom:10px;}
.loading{text-align:center;padding:50px 20px;color:var(--texto-claro);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo">99</div>
    <div>
      <div class="topbar-title">Handover</div>
      <div class="topbar-sub">Postos listados aguardando transição pro Nursery</div>
    </div>
  </div>
  <a class="topbar-voltar" id="link-voltar" href="hub_bd.html">← Menu</a>
</div>

<div class="container">
  <div id="lista"><div class="loading">Carregando...</div></div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/a/macros/99app.com/s/AKfycbyGDiXKWhHlEG9zMBbpg7ADTuU_Ares6xivwmSrMvFnj0689ILmisASnfgZie0botnZ0A/exec';

let quemAtual = '';
let handoversAtuais = [];

window.onload = function() {
  const params = new URLSearchParams(window.location.search);
  quemAtual = params.get('nome') || '';
  document.getElementById('link-voltar').href = 'hub_bd.html' + (quemAtual ? ('?nome=' + encodeURIComponent(quemAtual)) : '');
  if (!quemAtual) {
    document.getElementById('lista').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>Acesse essa página pelo menu, faltou identificar quem você é.</div>';
    return;
  }
  carregar();
};

function carregar() {
  const cb = 'cbaquis_' + Date.now();
  window[cb] = function(data) {
    delete window[cb];
    const el = document.getElementById('jsonp-aquis');
    if (el) el.remove();
    handoversAtuais = Array.isArray(data) ? data : [];
    renderizar();
  };
  const s = document.createElement('script');
  s.id = 'jsonp-aquis';
  s.onerror = function() {
    delete window[cb];
    document.getElementById('lista').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>Não consegui buscar os handovers. Tenta recarregar.</div>';
  };
  s.src = SCRIPT_URL + '?tipo=handovers_aquisicao&bd=' + encodeURIComponent(quemAtual) + '&callback=' + cb + '&t=' + Date.now();
  document.head.appendChild(s);
}

function renderizar() {
  const container = document.getElementById('lista');
  if (!handoversAtuais.length) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">✅</div>Nenhum handover pendente pra você agora.</div>';
    return;
  }

  container.innerHTML = handoversAtuais.map(h => {
    let acoes = '';

    if (h.status === 'Aguardando início') {
      acoes = `<button class="btn-acao" onclick="marcarGrupoCriado('${h.id_handover}')">Marcar grupo de WhatsApp criado</button>`;
    } else if (h.status === 'Grupo de WhatsApp criado') {
      acoes = `
        <div class="upload-box">
          <input type="file" id="arquivo-${h.id_handover}" accept="image/*">
          <button class="btn-acao" id="btn-print-${h.id_handover}" onclick="enviarPrint('${h.id_handover}')">Enviar print pra validação</button>
        </div>`;
    } else if (h.status === 'Print enviado, aguardando validação') {
      acoes = `
        <div class="aviso-aguardando">Print enviado. Aguardando o Nursery conferir e confirmar o handover.</div>
        ${h.gemini_obs ? `<div class="gemini-fyi">🤖 Gemini: ${h.gemini_obs}</div>` : ''}
        <div class="upload-box">
          <input type="file" id="arquivo-${h.id_handover}" accept="image/*">
          <button class="btn-acao-secundario" id="btn-print-${h.id_handover}" onclick="enviarPrint('${h.id_handover}')">Enviar outro print, se precisar</button>
        </div>`;
    }

    return `
    <div class="card" id="card-${h.id_handover}">
      <div class="card-top">
        <div class="card-posto">${h.posto || 'Posto não informado'}</div>
        <div class="card-status">${h.status}</div>
      </div>
      <div class="card-meta">CNPJ: <b>${h.cnpj}</b></div>
      <div class="card-meta">Nursery responsável: <b>${h.bd_nursery || '-'}</b></div>
      ${acoes}
    </div>`;
  }).join('');
}

function marcarGrupoCriado(id) {
  const params = new URLSearchParams({ action: 'marcar_grupo_criado', id_handover: id });
  const cb = 'cbgrupo_' + Date.now();
  window[cb] = function(resultado) {
    delete window[cb];
    const el = document.getElementById('jsonp-grupo');
    if (el) el.remove();
    if (!resultado || resultado.status !== 'ok') { alert('Erro ao marcar. Tenta de novo.'); return; }
    carregar();
  };
  const s = document.createElement('script');
  s.id = 'jsonp-grupo';
  s.onerror = function() { delete window[cb]; alert('Erro ao marcar. Tenta de novo.'); };
  s.src = SCRIPT_URL + '?' + params.toString() + '&callback=' + cb;
  document.head.appendChild(s);
}

// ── Envio do print: precisa de POST (a imagem em base64 não cabe numa
// URL de GET), então usa fetch() direto pra essa ação específica. ──
function enviarPrint(id) {
  const inputArquivo = document.getElementById('arquivo-' + id);
  const arquivo = inputArquivo.files[0];
  if (!arquivo) { alert('Escolhe uma imagem antes de enviar.'); return; }

  const btn = document.getElementById('btn-print-' + id);
  const textoOriginal = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  const leitor = new FileReader();
  leitor.onload = async function() {
    const base64Completo = leitor.result; // ex: data:image/png;base64,AAAA...
    const base64Puro = base64Completo.split(',')[1];

    try {
      const resposta = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'enviar_print_handover',
          id_handover: id,
          imagem_base64: base64Puro,
          mime_type: arquivo.type || 'image/png'
        })
      });
      const resultado = await resposta.json();

      if (!resultado || resultado.status !== 'ok') {
        alert('Erro ao enviar: ' + (resultado && resultado.msg || 'desconhecido'));
        btn.disabled = false;
        btn.textContent = textoOriginal;
        return;
      }

      alert('Print enviado! Agora é só aguardar o Nursery conferir e confirmar o handover.');
      carregar();
    } catch (err) {
      alert('Erro de conexão ao enviar o print. Tenta de novo.');
      btn.disabled = false;
      btn.textContent = textoOriginal;
    }
  };
  leitor.readAsDataURL(arquivo);
}
</script>
</body>
</html>
