<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T(I.A)GA , 99Abastece Relaunch SP</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --amarelo: #FFD600; --preto: #1A1A1A; --cinza-escuro: #232323; --cinza-medio: #2C2C2C;
  --branco: #FFFFFF; --texto-claro: #9A9A9A; --borda: #3A3A3A;
  --verde: #00C853; --vermelho: #FF5252; --laranja: #FFA726; --radius: 10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Montserrat',sans-serif;font-size:13px;background:var(--preto);color:var(--branco);min-height:100vh;}
.topbar{background:var(--amarelo);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.topbar-brand{display:flex;align-items:center;gap:10px;}
.topbar-logo{width:34px;height:34px;background:var(--preto);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--amarelo);}
.topbar-title{font-weight:800;font-size:16px;color:var(--preto);line-height:1.1;}
.topbar-sub{font-size:11px;font-weight:600;color:rgba(0,0,0,.55);}
.topbar-voltar{background:var(--preto);color:var(--amarelo);border:none;border-radius:8px;padding:8px 14px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;cursor:pointer;text-decoration:none;}

.container{max-width:640px;margin:0 auto;padding:60px 24px 60px;}

.busca-titulo{text-align:center;font-size:13px;color:var(--texto-claro);margin-bottom:16px;}
.busca-input{width:100%;background:var(--cinza-medio);border:1.5px solid var(--borda);border-radius:10px;color:var(--branco);font-family:'Montserrat',sans-serif;font-size:16px;padding:16px;outline:none;text-align:center;margin-bottom:16px;}
.busca-input:focus{border-color:var(--amarelo);}
.busca-btn{width:100%;background:var(--amarelo);color:var(--preto);border:none;border-radius:10px;padding:18px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:15px;cursor:pointer;margin-bottom:32px;}
.busca-btn:disabled{opacity:.5;cursor:not-allowed;}

.busca-vazio{background:var(--cinza-escuro);border:1.5px dashed var(--borda);border-radius:var(--radius);padding:20px;text-align:center;color:var(--vermelho);font-size:12.5px;font-weight:700;}

.termo-card{background:var(--cinza-escuro);border:1.5px solid var(--borda);border-left:5px solid var(--laranja);border-radius:var(--radius);padding:20px 24px;margin-bottom:14px;}
.termo-card.etapa-listado{border-left-color:var(--verde);}
.termo-card.etapa-deslistado, .termo-card.etapa-obsoleto{border-left-color:var(--vermelho);}
.termo-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
.termo-posto{font-weight:800;font-size:15px;}
.termo-etapa{font-size:10px;font-weight:800;padding:3px 10px;border-radius:12px;white-space:nowrap;}
.etapa-listado .termo-etapa{background:#0F2E20;color:var(--verde);}
.etapa-deslistado .termo-etapa, .etapa-obsoleto .termo-etapa{background:#3D0000;color:var(--vermelho);}
.termo-card:not(.etapa-listado):not(.etapa-deslistado):not(.etapa-obsoleto) .termo-etapa{background:#3D2A00;color:var(--laranja);}
.termo-meta{font-size:11px;color:var(--texto-claro);margin-bottom:2px;}
.termo-meta b{color:var(--branco);}

.contexto-box{background:#1C2A1C;border:1px solid #3A4A3A;border-radius:var(--radius);padding:16px 20px;margin-bottom:14px;}
.contato-box{background:#231A00;border:1px solid #FFA726;border-radius:var(--radius);padding:14px 20px;margin-bottom:14px;}
.contato-label{font-size:10px;font-weight:700;color:var(--laranja);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
.contato-valor{font-size:13px;font-weight:800;color:var(--branco);}
.contato-origem{font-size:10px;color:#9A9A9A;margin-top:6px;}
.visitas-contador{text-align:center;font-size:11px;color:var(--texto-claro);margin-bottom:12px;}
.btn-pitch{width:100%;margin-bottom:14px;background:linear-gradient(90deg,#7B3FE4,#5C2FB8);color:var(--branco);border:none;border-radius:8px;padding:12px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:12.5px;cursor:pointer;}
.btn-pitch:disabled{opacity:.5;cursor:not-allowed;}
.pitch-box{margin-bottom:14px;background:#211A33;border:1.5px solid #5C2FB8;border-radius:var(--radius);padding:16px 20px;font-size:12.5px;line-height:1.7;color:var(--branco);}
.pitch-label{font-size:10px;color:#B8A8E0;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;}
.btn-copiar{margin-top:10px;width:100%;background:#5C2FB8;color:#fff;border:none;border-radius:6px;padding:8px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:11px;cursor:pointer;}
.contexto-label{font-size:10px;font-weight:700;color:var(--texto-claro);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;}
.contexto-texto{font-size:12.5px;color:var(--branco);line-height:1.5;}
.contexto-origem{font-size:10px;color:#6E7A6E;margin-top:8px;}
.contexto-origem b{color:var(--texto-claro);}

.historico-box{background:var(--cinza-escuro);border:1.5px solid var(--borda);border-radius:var(--radius);padding:16px 20px;}
.historico-label{font-size:10px;font-weight:700;color:var(--texto-claro);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;}
.historico-item{font-size:11.5px;color:#B0B8B0;padding:8px 0;border-bottom:1px solid var(--cinza-medio);}
.historico-item:last-child{border-bottom:none;}
.historico-item b{color:var(--branco);}
.historico-tag{font-size:9px;font-weight:800;padding:2px 8px;border-radius:8px;background:var(--cinza-medio);color:var(--texto-claro);margin-left:6px;}

.loading{text-align:center;padding:30px 20px;color:var(--texto-claro);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo">99</div>
    <div>
      <div class="topbar-title">T(I.A)GA</div>
      <div class="topbar-sub">Boot Copiloto</div>
    </div>
  </div>
  <a class="topbar-voltar" id="link-voltar" href="hub_bd.html">← Menu</a>
</div>

<div class="container">

  <div class="busca-titulo">Digite o CNPJ do posto que quer consultar</div>
  <input type="text" id="busca-cnpj" class="busca-input" inputmode="numeric" placeholder="12345678000100">
  <button class="busca-btn" id="btn-buscar" onclick="buscarCnpj()">🔍 Consultar CNPJ</button>

  <div id="resultado"></div>

</div>

<script>
const SCRIPT_URL = 'https://script.google.com/a/macros/99app.com/s/AKfycbyGDiXKWhHlEG9zMBbpg7ADTuU_Ares6xivwmSrMvFnj0689ILmisASnfgZie0botnZ0A/exec';

let quemAtual = '';
let cnpjAtual = '';
let postoAtual = '';

window.onload = function() {
  const params = new URLSearchParams(window.location.search);
  quemAtual = params.get('nome') || '';
  document.getElementById('link-voltar').href = 'hub_bd.html' + (quemAtual ? ('?nome=' + encodeURIComponent(quemAtual)) : '');
  document.getElementById('busca-cnpj').addEventListener('keydown', function(ev) {
    if (ev.key === 'Enter') buscarCnpj();
  });
};

function classeEtapa(etapa) {
  const s = (etapa || '').toLowerCase();
  if (s.includes('11_listado')) return 'etapa-listado';
  if (s.includes('12_deslistado')) return 'etapa-deslistado';
  if (s.includes('13_lead obsoleto')) return 'etapa-obsoleto';
  return '';
}

function buscarCnpj() {
  const valor = document.getElementById('busca-cnpj').value.replace(/\D/g, '');
  const resultBox = document.getElementById('resultado');
  if (!valor) { resultBox.innerHTML = '<div class="busca-vazio">Digite um CNPJ antes de buscar.</div>'; return; }

  const btn = document.getElementById('btn-buscar');
  btn.disabled = true;
  btn.textContent = 'Buscando...';
  resultBox.innerHTML = '<div class="loading">Consultando em todas as waves...</div>';

  const cb = 'cbconsulta_' + Date.now();
  window[cb] = function(resultado) {
    delete window[cb];
    const el = document.getElementById('jsonp-consulta');
    if (el) el.remove();
    btn.disabled = false;
    btn.textContent = '🔍 Consultar CNPJ';
    renderizarResultado(resultado);
  };
  const s = document.createElement('script');
  s.id = 'jsonp-consulta';
  s.onerror = function() {
    delete window[cb];
    btn.disabled = false;
    btn.textContent = '🔍 Consultar CNPJ';
    resultBox.innerHTML = '<div class="busca-vazio">Erro ao buscar. Tenta de novo.</div>';
  };
  s.src = SCRIPT_URL + '?tipo=consulta_cnpj&cnpj=' + encodeURIComponent(valor) + '&callback=' + cb + '&t=' + Date.now();
  document.head.appendChild(s);
}

function renderizarResultado(resultado) {
  const resultBox = document.getElementById('resultado');
  if (!resultado || resultado.status === 'erro') {
    resultBox.innerHTML = '<div class="busca-vazio">' + (resultado && resultado.msg || 'Erro ao buscar.') + '</div>';
    return;
  }

  const contexto = Array.isArray(resultado.contexto) ? resultado.contexto : [];
  cnpjAtual = document.getElementById('busca-cnpj').value.replace(/\D/g, '');
  postoAtual = (resultado.termo && resultado.termo.nome_posto) || '';
  let html = '';

  if (resultado.status === 'ok' && resultado.termo) {
    const t = resultado.termo;
    const classe = classeEtapa(t.etapa_funil);
    html += `
      <div class="termo-card ${classe}">
        <div class="termo-top">
          <div class="termo-posto">${t.nome_posto || 'Posto não informado'}</div>
          <div class="termo-etapa">${t.etapa_funil || 'Etapa não encontrada'}</div>
        </div>
        <div class="termo-meta">CNPJ: <b>${t.cnpj}</b> · BD do termo: <b>${t.bd || '-'}</b></div>
        <div class="termo-meta">Assinado em: <b>${t.data_assinatura || '-'}</b> ${t.socio_assinou ? '· Sócio: <b>' + t.socio_assinou + '</b>' : ''}</div>
      </div>`;
  } else {
    html += '<div class="busca-vazio">Esse CNPJ não tem termo assinado esse mês.</div>';
  }

  if (contexto.length) {
    html += `<div class="visitas-contador">${contexto.length} visita${contexto.length > 1 ? 's' : ''} encontrada${contexto.length > 1 ? 's' : ''} em todas as waves</div>`;

    if (resultado.contato && resultado.contato.contato) {
      html += `
        <div class="contato-box">
          <div class="contato-label">📞 Contato coletado (${resultado.contato.tipo})</div>
          <div class="contato-valor">${resultado.contato.contato}</div>
          <div class="contato-origem">Coletado por <b>${resultado.contato.bd || '-'}</b> em ${resultado.contato.data || '-'}</div>
        </div>`;
    }

    const ultima = contexto[0];
    html += `
      <div class="contexto-box">
        <div class="contexto-label">Contexto da última visita</div>
        <div class="contexto-texto">${ultima.resumo || ultima.status || 'Sem resumo registrado.'}</div>
        <div class="contexto-origem">Registrado por <b>${ultima.bd || '-'}</b> em ${ultima.data || '-'} <span class="historico-tag">${ultima.origem}</span></div>
      </div>`;

    html += `<button class="btn-pitch" id="btn-pitch" onclick="gerarPitch()">✨ Gerar sugestão de pitch</button>
      <div id="pitch-resultado"></div>`;

    if (contexto.length > 1) {
      html += `
        <div class="historico-box">
          <div class="historico-label">Histórico completo (todos os BDs e waves)</div>
          ${contexto.slice(1).map(c => `
            <div class="historico-item">${c.data || '-'} · <b>${c.bd || '-'}</b> · ${c.status || c.resumo || '-'}<span class="historico-tag">${c.origem}</span></div>
          `).join('')}
        </div>`;
    }
  } else if (resultado.status === 'nao_encontrado') {
    html += '<div class="busca-vazio" style="margin-top:14px;">Nenhum histórico de visita encontrado pra esse CNPJ em nenhuma wave.</div>';
  }

  resultBox.innerHTML = html;
}

function gerarPitch() {
  const btn = document.getElementById('btn-pitch');
  const box = document.getElementById('pitch-resultado');
  btn.disabled = true;
  btn.textContent = 'Gerando...';
  box.innerHTML = '';

  const params = new URLSearchParams({
    action: 'gerar_pitch_amplo',
    cnpj: cnpjAtual,
    posto: postoAtual,
    responsavel: quemAtual
  });
  const cb = 'cbpitchamplo_' + Date.now();
  window[cb] = function(resultado) {
    delete window[cb];
    const el = document.getElementById('jsonp-pitch');
    if (el) el.remove();
    btn.disabled = false;
    btn.textContent = '✨ Gerar sugestão de pitch';
    if (!resultado || resultado.status !== 'ok') {
      box.innerHTML = '<div class="pitch-box">Não consegui gerar a mensagem: ' + (resultado && resultado.msg || 'erro desconhecido') + '</div>';
      return;
    }
    box.innerHTML = '<div class="pitch-box"><p class="pitch-label">Mensagem sugerida</p><p id="pitch-texto" style="white-space:pre-wrap;">' + resultado.pitch + '</p>' +
      '<button class="btn-copiar" onclick="copiarPitch()">Copiar mensagem</button></div>';
  };
  const s = document.createElement('script');
  s.id = 'jsonp-pitch';
  s.onerror = function() {
    delete window[cb];
    btn.disabled = false;
    btn.textContent = '✨ Gerar sugestão de pitch';
    box.innerHTML = '<div class="pitch-box">Erro ao gerar a mensagem.</div>';
  };
  s.src = SCRIPT_URL + '?' + params.toString() + '&callback=' + cb;
  document.head.appendChild(s);
}

function copiarPitch() {
  const texto = document.getElementById('pitch-texto').innerText;
  navigator.clipboard.writeText(texto).then(() => alert('Mensagem copiada!'));
}
</script>
</body>
</html>
