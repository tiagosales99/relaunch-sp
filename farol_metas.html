<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farol de Metas , 99Abastece Relaunch SP</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --amarelo: #FFD600; --preto: #1A1A1A; --cinza-escuro: #232323; --cinza-medio: #2C2C2C;
  --branco: #FFFFFF; --texto-claro: #9A9A9A; --borda: #3A3A3A;
  --verde: #00C853; --vermelho: #FF5252; --laranja: #FFA726; --radius: 10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Montserrat',sans-serif;font-size:13px;background:var(--preto);color:var(--branco);min-height:100vh;}
.topbar{background:var(--amarelo);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.topbar-brand{display:flex;align-items:center;gap:10px;}
.topbar-logo{width:34px;height:34px;background:var(--preto);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--amarelo);}
.topbar-title{font-weight:800;font-size:16px;color:var(--preto);line-height:1.1;}
.topbar-sub{font-size:11px;font-weight:600;color:rgba(0,0,0,.55);}
.topbar-voltar{background:var(--preto);color:var(--amarelo);border:none;border-radius:8px;padding:8px 14px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;cursor:pointer;text-decoration:none;}

.container{max-width:700px;margin:0 auto;padding:40px 24px 60px;}

.farol-card{background:var(--cinza-escuro);border:1.5px solid var(--borda);border-radius:14px;padding:32px;text-align:center;}
.farol-titulo{font-size:13px;font-weight:700;color:var(--texto-claro);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.farol-bd{font-size:20px;font-weight:800;margin-bottom:24px;}

.farol-numeros{display:flex;justify-content:center;gap:40px;margin-bottom:24px;}
.farol-num{text-align:center;}
.farol-num-valor{font-size:32px;font-weight:800;}
.farol-num-label{font-size:11px;color:var(--texto-claro);text-transform:uppercase;letter-spacing:.4px;margin-top:4px;}

.barra-fundo{background:var(--cinza-medio);border-radius:20px;height:22px;overflow:hidden;margin-bottom:10px;}
.barra-preenchida{height:100%;border-radius:20px;transition:width .4s;}

.farol-percentual{font-size:22px;font-weight:800;margin-bottom:6px;}
.farol-gap{font-size:12px;color:var(--texto-claro);}
.farol-gap b{color:var(--branco);}

.empty{text-align:center;padding:50px 20px;color:var(--texto-claro);}
.empty-icon{font-size:30px;margin-bottom:10px;}
.loading{text-align:center;padding:50px 20px;color:var(--texto-claro);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo">99</div>
    <div>
      <div class="topbar-title">Farol de Metas</div>
      <div class="topbar-sub">Sua meta de T&C no mês</div>
    </div>
  </div>
  <a class="topbar-voltar" id="link-voltar" href="hub_bd.html">← Menu</a>
</div>

<div class="container">
  <div id="conteudo"><div class="loading">Carregando farol...</div></div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/a/macros/99app.com/s/AKfycbyGDiXKWhHlEG9zMBbpg7ADTuU_Ares6xivwmSrMvFnj0689ILmisASnfgZie0botnZ0A/exec';

let quemAtual = '';

window.onload = function() {
  const params = new URLSearchParams(window.location.search);
  quemAtual = params.get('nome') || '';
  document.getElementById('link-voltar').href = 'hub_bd.html' + (quemAtual ? ('?nome=' + encodeURIComponent(quemAtual)) : '');
  if (!quemAtual) {
    document.getElementById('conteudo').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>Acesse essa página pelo menu, faltou identificar quem você é.</div>';
    return;
  }
  carregarFarol();
};

function formatarPercentual(valor) {
  if (valor === '' || valor === null || valor === undefined) return '0%';
  const n = Number(valor);
  if (isNaN(n)) return String(valor);
  // valores tipo 0.58 (fração) viram 58%; valores tipo 58 já ficam 58%
  const pct = n <= 1 ? n * 100 : n;
  return Math.round(pct) + '%';
}

function carregarFarol() {
  const cb = 'cbfarol_' + Date.now();
  window[cb] = function(resultado) {
    delete window[cb];
    const el = document.getElementById('jsonp-farol');
    if (el) el.remove();

    if (!resultado || resultado.status !== 'ok') {
      document.getElementById('conteudo').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>' + (resultado && resultado.msg || 'Não encontrei sua meta esse mês.') + '</div>';
      return;
    }

    const pctNum = Number(resultado.percentual) <= 1 ? Number(resultado.percentual) * 100 : Number(resultado.percentual);
    const pctSeguro = isNaN(pctNum) ? 0 : Math.max(0, Math.min(100, pctNum));
    const cor = pctSeguro >= 100 ? 'var(--verde)' : pctSeguro >= 60 ? 'var(--laranja)' : 'var(--vermelho)';

    document.getElementById('conteudo').innerHTML = `
      <div class="farol-card">
        <div class="farol-titulo">Meta de T&C — ${resultado.bd}</div>
        <div class="farol-bd">Termos assinados no mês</div>

        <div class="farol-numeros">
          <div class="farol-num">
            <div class="farol-num-valor" style="color:${cor}">${resultado.atual}</div>
            <div class="farol-num-label">Atual</div>
          </div>
          <div class="farol-num">
            <div class="farol-num-valor">${resultado.target}</div>
            <div class="farol-num-label">Meta</div>
          </div>
        </div>

        <div class="barra-fundo">
          <div class="barra-preenchida" style="width:${pctSeguro}%;background:${cor};"></div>
        </div>
        <div class="farol-percentual" style="color:${cor}">${formatarPercentual(resultado.percentual)}</div>
        <div class="farol-gap">Faltam <b>${Math.abs(resultado.gap)}</b> termo(s) pra bater a meta</div>
      </div>
    `;
  };
  const s = document.createElement('script');
  s.id = 'jsonp-farol';
  s.onerror = function() {
    delete window[cb];
    document.getElementById('conteudo').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>Não consegui buscar o farol. Tenta recarregar a página.</div>';
  };
  s.src = SCRIPT_URL + '?tipo=farol_metas&bd=' + encodeURIComponent(quemAtual) + '&callback=' + cb + '&t=' + Date.now();
  document.head.appendChild(s);
}
</script>
</body>
</html>
