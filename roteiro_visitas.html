<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roteiro de Visitas , 99Abastece Relaunch SP</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --amarelo: #FFD600; --preto: #1A1A1A; --cinza-escuro: #232323; --cinza-medio: #2C2C2C;
  --branco: #FFFFFF; --texto-claro: #9A9A9A; --borda: #3A3A3A; --radius: 10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Montserrat',sans-serif;font-size:13px;background:var(--preto);color:var(--branco);min-height:100vh;}
.topbar{background:var(--amarelo);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.topbar-brand{display:flex;align-items:center;gap:10px;}
.topbar-logo{width:34px;height:34px;background:var(--preto);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--amarelo);}
.topbar-title{font-weight:800;font-size:16px;color:var(--preto);line-height:1.1;}
.topbar-sub{font-size:11px;font-weight:600;color:rgba(0,0,0,.55);}
.topbar-voltar{background:var(--preto);color:var(--amarelo);border:none;border-radius:8px;padding:8px 14px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;cursor:pointer;text-decoration:none;}
.container{max-width:520px;margin:0 auto;padding:24px;}
.card{background:var(--cinza-escuro);border:1.5px solid var(--borda);border-radius:var(--radius);padding:16px 20px;}
.card-titulo{font-weight:800;font-size:13px;color:var(--branco);margin-bottom:14px;}
.parada{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.parada:last-child{margin-bottom:0;}
.parada-num{width:22px;height:22px;border-radius:50%;background:var(--amarelo);color:var(--preto);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.parada-nome{font-size:12px;color:var(--branco);}
.parada-grid{font-size:10px;color:var(--texto-claro);}
.aviso{font-size:11px;color:#6B6963;margin-top:12px;}
.empty{text-align:center;padding:40px 20px;color:var(--texto-claro);}
.loading{text-align:center;padding:30px;color:var(--texto-claro);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo">99</div>
    <div>
      <div class="topbar-title">Roteiro de Visitas</div>
      <div class="topbar-sub">Sugestão de rota agrupando pelo mesmo grid</div>
    </div>
  </div>
  <a class="topbar-voltar" id="link-voltar" href="hub_bd.html">← Menu</a>
</div>

<div class="container">
  <div id="lista"><div class="loading">Carregando...</div></div>
</div>

<script src="grids_relaunch.js"></script>
<script>
const APPS_SCRIPT_URL = 'https://script.google.com/a/macros/99app.com/s/AKfycbyGDiXKWhHlEG9zMBbpg7ADTuU_Ares6xivwmSrMvFnj0689ILmisASnfgZie0botnZ0A/exec';

let nomeAtual = '';

window.onload = function() {
  const params = new URLSearchParams(window.location.search);
  nomeAtual = params.get('nome') || '';
  document.getElementById('link-voltar').href = 'hub_bd.html' + (nomeAtual ? ('?nome=' + encodeURIComponent(nomeAtual)) : '');
  carregar();
};

function pontoDentroPoligono(lat, lng, coords) {
  let dentro = false;
  for (let i = 0, j = coords.length - 1; i < coords.length; j = i++) {
    const xi = coords[i][0], yi = coords[i][1];
    const xj = coords[j][0], yj = coords[j][1];
    const intersecta = ((yi > lat) !== (yj > lat)) &&
      (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi);
    if (intersecta) dentro = !dentro;
  }
  return dentro;
}

function acharGridDoPosto(lat, lng) {
  for (const feature of GRIDS_RELAUNCH_SP.features) {
    const anel = feature.geometry.coordinates[0];
    if (pontoDentroPoligono(lat, lng, anel)) return feature.properties.grid;
  }
  return null;
}

function carregar() {
  const cb = 'cbroteiro_' + Date.now();
  window[cb] = function(data) {
    delete window[cb];
    const el = document.getElementById('jsonp-roteiro');
    if (el) el.remove();
    montarRoteiro((data && data.postos) || []);
  };
  const s = document.createElement('script');
  s.id = 'jsonp-roteiro';
  s.onerror = function() {
    delete window[cb];
    document.getElementById('lista').innerHTML = '<div class="empty">Não consegui carregar seus postos pendentes.</div>';
  };
  s.src = APPS_SCRIPT_URL + '?tipo=roteiro_visitas&bd=' + encodeURIComponent(nomeAtual) + '&callback=' + cb + '&t=' + Date.now();
  document.head.appendChild(s);
}

function montarRoteiro(postos) {
  const container = document.getElementById('lista');
  if (!postos.length) {
    container.innerHTML = '<div class="empty">Nenhuma tarefa pendente com posto pra visitar agora.</div>';
    return;
  }

  postos.forEach(p => {
    p.grid = (p.lat && p.long) ? acharGridDoPosto(p.lat, p.long) : null;
  });

  // Agrupa por grid (mesmo grid primeiro), depois os sem grid conhecido no final
  const comGrid = postos.filter(p => p.grid !== null).sort((a, b) => a.grid - b.grid);
  const semGrid = postos.filter(p => p.grid === null);
  const ordenado = comGrid.concat(semGrid);

  container.innerHTML = `
    <div class="card">
      <div class="card-titulo">Sugestão de rota &middot; ${ordenado.length} posto(s)</div>
      ${ordenado.map((p, i) => `
        <div class="parada">
          <div class="parada-num">${i + 1}</div>
          <div>
            <div class="parada-nome">${p.posto || 'Posto não informado'}</div>
            <div class="parada-grid">${p.grid !== null ? 'Grid ' + p.grid : 'Grid não identificado'}</div>
          </div>
        </div>
      `).join('')}
      <div class="aviso">Agrupa por mesmo grid primeiro, depois grids vizinhos — sem otimização de distância real (não usa Google Maps Directions).</div>
    </div>
  `;
}
</script>
</body>
</html>
