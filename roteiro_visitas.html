<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roteiro de Visitas , 99Abastece Relaunch SP</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --amarelo: #FFD600; --preto: #1A1A1A; --cinza-escuro: #232323; --cinza-medio: #2C2C2C;
  --branco: #FFFFFF; --texto-claro: #9A9A9A; --borda: #3A3A3A;
  --verde: #00C853; --vermelho: #FF5252; --laranja: #FFA726; --radius: 10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Montserrat',sans-serif;font-size:13px;background:var(--preto);color:var(--branco);min-height:100vh;}
.topbar{background:var(--amarelo);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.topbar-brand{display:flex;align-items:center;gap:10px;}
.topbar-logo{width:34px;height:34px;background:var(--preto);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--amarelo);}
.topbar-title{font-weight:800;font-size:16px;color:var(--preto);line-height:1.1;}
.topbar-sub{font-size:11px;font-weight:600;color:rgba(0,0,0,.55);}
.topbar-voltar{background:var(--preto);color:var(--amarelo);border:none;border-radius:8px;padding:8px 14px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;cursor:pointer;text-decoration:none;}
.container{max-width:560px;margin:0 auto;padding:20px 24px 60px;}

.filtros-card{background:var(--cinza-escuro);border:1px solid var(--borda);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;}
.filtros-titulo{font-size:12px;font-weight:800;color:var(--branco);margin-bottom:14px;}
.campo{margin-bottom:12px;}
.campo-label{font-size:11px;color:var(--texto-claro);margin-bottom:5px;}
.campo select, .campo input{width:100%;background:var(--cinza-medio);border:1px solid var(--borda);border-radius:8px;color:var(--branco);font-family:'Montserrat',sans-serif;font-size:12px;padding:8px 10px;}
.prio-row{display:flex;gap:6px;}
.prio-btn{flex:1;background:var(--cinza-medio);color:var(--texto-claro);border:1px solid var(--borda);border-radius:6px;padding:6px;text-align:center;font-size:11px;cursor:pointer;}
.prio-btn.ativo{background:var(--amarelo);color:var(--preto);border-color:var(--amarelo);font-weight:700;}
.check-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.check-row input{width:16px;height:16px;accent-color:var(--amarelo);}
.raio-row{display:flex;gap:8px;}
.raio-row input:last-child{width:64px;}
.btn-gerar{width:100%;background:var(--amarelo);color:var(--preto);border:none;border-radius:8px;padding:11px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:13px;cursor:pointer;margin-top:4px;}
.btn-gerar:disabled{opacity:.5;cursor:not-allowed;}

.resultado-card{background:var(--cinza-escuro);border:1px solid var(--borda);border-radius:var(--radius);padding:16px 20px;}
.resultado-titulo{font-size:12px;font-weight:800;color:var(--branco);margin-bottom:12px;}
.parada{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.parada:last-child{margin-bottom:0;}
.parada-num{width:22px;height:22px;border-radius:50%;background:var(--amarelo);color:var(--preto);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.parada-nome{font-size:12px;color:var(--branco);}
.parada-meta{font-size:10px;color:var(--texto-claro);}
.empty{text-align:center;padding:30px 20px;color:var(--texto-claro);}
.loading{text-align:center;padding:30px 20px;color:var(--texto-claro);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo">99</div>
    <div>
      <div class="topbar-title">Roteiro de Visitas</div>
      <div class="topbar-sub">Monte a rota do dia com os filtros abaixo</div>
    </div>
  </div>
  <a class="topbar-voltar" id="link-voltar" href="hub_bd.html">← Menu</a>
</div>

<div class="container">

  <div class="filtros-card">
    <div class="filtros-titulo">Filtros</div>

    <div class="campo">
      <div class="campo-label">Sub-região</div>
      <select id="filtro-sub"><option value="">Todas</option></select>
    </div>

    <div class="campo">
      <div class="campo-label">Bairro</div>
      <select id="filtro-bairro"><option value="">Todos</option></select>
    </div>

    <div class="campo">
      <div class="campo-label">Prioridade</div>
      <div class="prio-row" id="prio-row">
        <div class="prio-btn ativo" data-val="">Todas</div>
        <div class="prio-btn" data-val="high">High Priority</div>
        <div class="prio-btn" data-val="priority">Priority</div>
      </div>
    </div>

    <div class="campo">
      <div class="campo-label">Rede</div>
      <select id="filtro-rede"><option value="">Todas</option></select>
    </div>

    <div class="campo">
      <div class="campo-label">Status da visita</div>
      <select id="filtro-status"><option value="">Qualquer status</option></select>
    </div>

    <div class="check-row">
      <input type="checkbox" id="filtro-nao-visitado" />
      <div style="font-size:12px;">Só postos ainda não visitados esse mês</div>
    </div>

    <div class="campo">
      <div class="campo-label">Raio a partir de um posto (opcional)</div>
      <div class="raio-row">
        <select id="filtro-raio-cnpj"><option value="">Escolher posto de partida</option></select>
        <input type="number" id="filtro-raio-km" placeholder="Km" />
      </div>
    </div>

    <button class="btn-gerar" id="btn-gerar" disabled>Gerar rota</button>
    <div id="msg-carregamento" style="font-size:11px; color:var(--texto-claro); margin-top:8px; text-align:center;">Carregando seus leads...</div>
  </div>

  <div class="resultado-card" id="resultado-card" style="display:none;">
    <div class="resultado-titulo" id="resultado-titulo"></div>
    <div id="lista-paradas"></div>
  </div>

</div>

<script src="grids_relaunch.js"></script>
<script>
const APPS_SCRIPT_URL = 'https://script.google.com/a/macros/99app.com/s/AKfycbyGDiXKWhHlEG9zMBbpg7ADTuU_Ares6xivwmSrMvFnj0689ILmisASnfgZie0botnZ0A/exec';

let nomeAtual = '';
let todosLeads = [];
let prioridadeAtiva = '';

window.onload = function() {
  const params = new URLSearchParams(window.location.search);
  nomeAtual = params.get('nome') || '';
  document.getElementById('link-voltar').href = 'hub_bd.html' + (nomeAtual ? ('?nome=' + encodeURIComponent(nomeAtual)) : '');
  carregarLeads();

  document.querySelectorAll('.prio-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.prio-btn').forEach(b => b.classList.remove('ativo'));
      btn.classList.add('ativo');
      prioridadeAtiva = btn.dataset.val;
    });
  });

  document.getElementById('btn-gerar').addEventListener('click', gerarRota);
};

function pontoDentroPoligono(lat, lng, coords) {
  let dentro = false;
  for (let i = 0, j = coords.length - 1; i < coords.length; j = i++) {
    const xi = coords[i][0], yi = coords[i][1];
    const xj = coords[j][0], yj = coords[j][1];
    const intersecta = ((yi > lat) !== (yj > lat)) &&
      (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi);
    if (intersecta) dentro = !dentro;
  }
  return dentro;
}
function acharGridDoPosto(lat, lng) {
  for (const feature of GRIDS_RELAUNCH_SP.features) {
    if (pontoDentroPoligono(lat, lng, feature.geometry.coordinates[0])) return feature.properties.grid;
  }
  return null;
}
function distanciaKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function carregarLeads() {
  const btn = document.getElementById('btn-gerar');
  const msg = document.getElementById('msg-carregamento');
  const cb = 'cbroteiro_' + Date.now();
  window[cb] = function(data) {
    delete window[cb];
    const el = document.getElementById('jsonp-roteiro');
    if (el) el.remove();

    if (!data || data.status !== 'ok') {
      msg.textContent = '⚠️ ' + ((data && data.msg) || 'Não consegui carregar seus leads.');
      msg.style.color = 'var(--vermelho)';
      return;
    }

    todosLeads = data.leads || [];
    if (!todosLeads.length) {
      msg.textContent = 'Nenhum lead encontrado pra você na Leads W_3.';
      return;
    }

    montarFiltrosDinamicos();
    msg.textContent = `${todosLeads.length} lead(s) carregado(s).`;
    btn.disabled = false;
  };
  const s = document.createElement('script');
  s.id = 'jsonp-roteiro';
  s.onerror = function() {
    delete window[cb];
    msg.textContent = '⚠️ Erro de conexão ao buscar seus leads. Recarrega a página.';
    msg.style.color = 'var(--vermelho)';
  };
  s.src = APPS_SCRIPT_URL + '?tipo=leads_para_roteiro&bd=' + encodeURIComponent(nomeAtual) + '&callback=' + cb + '&t=' + Date.now();
  document.head.appendChild(s);
}

function montarFiltrosDinamicos() {
  const subs = [...new Set(todosLeads.map(l => l.sub).filter(Boolean))].sort();
  const bairros = [...new Set(todosLeads.map(l => l.bairro).filter(Boolean))].sort();
  const redes = [...new Set(todosLeads.map(l => l.rede).filter(Boolean))].sort();
  const status = [...new Set(todosLeads.map(l => l.status_visita).filter(Boolean))].sort();
  const comCoordenada = todosLeads.filter(l => l.lat && l.long);

  const selSub = document.getElementById('filtro-sub');
  subs.forEach(s => selSub.innerHTML += `<option value="${s}">Sub ${s}</option>`);

  const selBairro = document.getElementById('filtro-bairro');
  bairros.forEach(b => selBairro.innerHTML += `<option value="${b}">${b}</option>`);

  const selRede = document.getElementById('filtro-rede');
  redes.forEach(r => selRede.innerHTML += `<option value="${r}">${r}</option>`);

  const selStatus = document.getElementById('filtro-status');
  status.forEach(st => selStatus.innerHTML += `<option value="${st}">${st}</option>`);

  const selRaio = document.getElementById('filtro-raio-cnpj');
  comCoordenada.forEach(l => selRaio.innerHTML += `<option value="${l.cnpj}">${l.posto || l.cnpj}</option>`);
}

function gerarRota() {
  const sub = document.getElementById('filtro-sub').value;
  const bairro = document.getElementById('filtro-bairro').value;
  const rede = document.getElementById('filtro-rede').value;
  const status = document.getElementById('filtro-status').value;
  const soNaoVisitado = document.getElementById('filtro-nao-visitado').checked;
  const raioCnpj = document.getElementById('filtro-raio-cnpj').value;
  const raioKm = Number(document.getElementById('filtro-raio-km').value);

  let filtrados = todosLeads.filter(l => {
    if (sub && l.sub !== sub) return false;
    if (bairro && l.bairro !== bairro) return false;
    if (rede && l.rede !== rede) return false;
    if (status && l.status_visita !== status) return false;
    if (soNaoVisitado && l.visitado_esse_mes) return false;
    if (prioridadeAtiva === 'high' && !/high/i.test(l.prioridade)) return false;
    if (prioridadeAtiva === 'priority' && !/priority/i.test(l.prioridade)) return false;
    return true;
  });

  if (raioCnpj && raioKm) {
    const origem = todosLeads.find(l => l.cnpj === raioCnpj);
    if (origem && origem.lat && origem.long) {
      filtrados = filtrados.filter(l => l.lat && l.long && distanciaKm(origem.lat, origem.long, l.lat, l.long) <= raioKm);
    }
  }

  filtrados.forEach(l => { l.grid = (l.lat && l.long) ? acharGridDoPosto(l.lat, l.long) : null; });
  const comGrid = filtrados.filter(l => l.grid !== null).sort((a, b) => a.grid - b.grid);
  const semGrid = filtrados.filter(l => l.grid === null);
  const ordenado = comGrid.concat(semGrid);

  const card = document.getElementById('resultado-card');
  const titulo = document.getElementById('resultado-titulo');
  const lista = document.getElementById('lista-paradas');
  card.style.display = 'block';

  if (!ordenado.length) {
    titulo.textContent = 'Nenhum posto encontrado com esses filtros';
    lista.innerHTML = '<div class="empty">Tenta afrouxar algum filtro.</div>';
    return;
  }

  titulo.textContent = `Sugestão de rota · ${ordenado.length} posto(s)`;
  lista.innerHTML = ordenado.map((l, i) => `
    <div class="parada">
      <div class="parada-num">${i + 1}</div>
      <div>
        <div class="parada-nome">${l.posto || l.cnpj}</div>
        <div class="parada-meta">${l.bairro || '-'}${l.grid !== null ? ' · Grid ' + l.grid : ''}${l.rede ? ' · ' + l.rede : ''}</div>
      </div>
    </div>
  `).join('');
}
</script>
</body>
</html>
