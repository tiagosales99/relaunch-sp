<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmar Reuniões , 99Abastece Relaunch SP</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --amarelo: #FFD600; --preto: #1A1A1A; --cinza-escuro: #232323; --cinza-medio: #2C2C2C;
  --branco: #FFFFFF; --texto-claro: #9A9A9A; --borda: #3A3A3A; --roxo: #7B3FE4; --radius: 10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Montserrat',sans-serif;font-size:13px;background:var(--preto);color:var(--branco);min-height:100vh;}
.topbar{background:var(--amarelo);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.topbar-brand{display:flex;align-items:center;gap:10px;}
.topbar-logo{width:34px;height:34px;background:var(--preto);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--amarelo);}
.topbar-title{font-weight:800;font-size:16px;color:var(--preto);line-height:1.1;}
.topbar-sub{font-size:11px;font-weight:600;color:rgba(0,0,0,.55);}
.topbar-voltar{background:var(--preto);color:var(--amarelo);border:none;border-radius:8px;padding:8px 14px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;cursor:pointer;text-decoration:none;}
.container{max-width:520px;margin:0 auto;padding:24px;}
.card{background:var(--cinza-escuro);border:1.5px solid var(--roxo);border-left:5px solid var(--roxo);border-radius:var(--radius);padding:16px 20px;margin-bottom:14px;}
.card-titulo{font-weight:800;font-size:14px;color:var(--branco);margin-bottom:4px;}
.card-sub{font-size:11px;color:var(--texto-claro);margin-bottom:14px;}
.pergunta{font-size:12px;color:var(--branco);margin-bottom:8px;}
.opcoes{display:flex;gap:8px;margin-bottom:10px;}
.opcoes button{flex:1;border-radius:8px;padding:9px;font-size:12px;font-weight:700;border:1.5px solid var(--borda);background:var(--cinza-medio);color:var(--texto-claro);cursor:pointer;}
.opcoes button.ativo-sim{border-color:#639922;background:#EAF3DE;color:#173404;}
.opcoes button.ativo-nao{border-color:#E24B4A;background:#FCEBEB;color:#501313;}
.btn-confirmar{width:100%;padding:10px;border-radius:8px;border:none;background:var(--amarelo);color:var(--preto);font-family:'Montserrat',sans-serif;font-weight:800;font-size:12px;cursor:pointer;margin-top:6px;}
.btn-confirmar:disabled{opacity:.5;cursor:not-allowed;}
.empty{text-align:center;padding:40px 20px;color:var(--texto-claro);}
.loading{text-align:center;padding:30px;color:var(--texto-claro);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo">99</div>
    <div>
      <div class="topbar-title">Confirmar Reuniões</div>
      <div class="topbar-sub">Reuniões marcadas pela SDR que já passaram da data</div>
    </div>
  </div>
  <a class="topbar-voltar" id="link-voltar" href="hub_bd.html">← Menu</a>
</div>

<div class="container">
  <div id="lista"><div class="loading">Carregando...</div></div>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/a/macros/99app.com/s/AKfycbyGDiXKWhHlEG9zMBbpg7ADTuU_Ares6xivwmSrMvFnj0689ILmisASnfgZie0botnZ0A/exec';

let nomeAtual = '';

window.onload = function() {
  const params = new URLSearchParams(window.location.search);
  nomeAtual = params.get('nome') || '';
  document.getElementById('link-voltar').href = 'hub_bd.html' + (nomeAtual ? ('?nome=' + encodeURIComponent(nomeAtual)) : '');
  carregar();
};

function carregar() {
  const cb = 'cbreunconf_' + Date.now();
  window[cb] = function(data) {
    delete window[cb];
    const el = document.getElementById('jsonp-reunconf');
    if (el) el.remove();
    renderizar(Array.isArray(data) ? data : []);
  };
  const s = document.createElement('script');
  s.id = 'jsonp-reunconf';
  s.onerror = function() {
    delete window[cb];
    document.getElementById('lista').innerHTML = '<div class="empty">Não consegui carregar as reuniões.</div>';
  };
  s.src = APPS_SCRIPT_URL + '?tipo=reunioes_pendentes_confirmacao&bd=' + encodeURIComponent(nomeAtual) + '&callback=' + cb + '&t=' + Date.now();
  document.head.appendChild(s);
}

function renderizar(lista) {
  const container = document.getElementById('lista');
  if (!lista.length) {
    container.innerHTML = '<div class="empty">Nenhuma reunião pendente de confirmação.</div>';
    return;
  }

  container.innerHTML = lista.map(r => `
    <div class="card" id="card-${r.id_reuniao}">
      <div class="card-titulo">${r.posto || 'Posto não informado'}</div>
      <div class="card-sub">Reunião marcada por ${r.agendado_por} &middot; ${r.data.split('-').reverse().join('/')} às ${r.hora}</div>
      <div class="pergunta">A reunião aconteceu?</div>
      <div class="opcoes" id="opcoes-aconteceu-${r.id_reuniao}">
        <button onclick="marcarAconteceu('${r.id_reuniao}', 'sim')">Sim, aconteceu</button>
        <button onclick="marcarAconteceu('${r.id_reuniao}', 'nao')">Não compareceu</button>
      </div>
      <div class="pergunta" id="pergunta-parceria-${r.id_reuniao}" style="display:none;">Virou parceria assinada?</div>
      <div class="opcoes" id="opcoes-parceria-${r.id_reuniao}" style="display:none;">
        <button onclick="selecionarParceria('${r.id_reuniao}', 'sim')">Sim</button>
        <button onclick="selecionarParceria('${r.id_reuniao}', 'nao')">Ainda não</button>
      </div>
      <button class="btn-confirmar" id="btn-${r.id_reuniao}" onclick="confirmar('${r.id_reuniao}')" disabled>Confirmar</button>
    </div>
  `).join('');
}

const estado = {};

function marcarAconteceu(id, valor) {
  estado[id] = estado[id] || {};
  estado[id].aconteceu = valor;

  const opcoes = document.getElementById('opcoes-aconteceu-' + id);
  opcoes.querySelectorAll('button').forEach(b => b.classList.remove('ativo-sim', 'ativo-nao'));
  opcoes.children[valor === 'sim' ? 0 : 1].classList.add(valor === 'sim' ? 'ativo-sim' : 'ativo-nao');

  const perguntaParceria = document.getElementById('pergunta-parceria-' + id);
  const opcoesParceria = document.getElementById('opcoes-parceria-' + id);
  if (valor === 'sim') {
    perguntaParceria.style.display = 'block';
    opcoesParceria.style.display = 'flex';
  } else {
    perguntaParceria.style.display = 'none';
    opcoesParceria.style.display = 'none';
    delete estado[id].virou_parceria;
  }
  atualizarBotao(id);
}

function selecionarParceria(id, valor) {
  estado[id] = estado[id] || {};
  estado[id].virou_parceria = valor;
  const opcoes = document.getElementById('opcoes-parceria-' + id);
  opcoes.querySelectorAll('button').forEach(b => b.classList.remove('ativo-sim', 'ativo-nao'));
  opcoes.children[valor === 'sim' ? 0 : 1].classList.add(valor === 'sim' ? 'ativo-sim' : 'ativo-nao');
  atualizarBotao(id);
}

function atualizarBotao(id) {
  const e = estado[id] || {};
  const btn = document.getElementById('btn-' + id);
  const completo = e.aconteceu === 'nao' || (e.aconteceu === 'sim' && e.virou_parceria);
  btn.disabled = !completo;
}

function confirmar(id) {
  const e = estado[id];
  const btn = document.getElementById('btn-' + id);
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  const params = new URLSearchParams({
    action: 'confirmar_reuniao',
    id_reuniao: id,
    aconteceu: e.aconteceu,
    virou_parceria: e.virou_parceria || ''
  });
  const cb = 'cbconfreun_' + Date.now();
  window[cb] = function(resultado) {
    delete window[cb];
    const el = document.getElementById('jsonp-confreun');
    if (el) el.remove();
    if (resultado && resultado.status === 'ok') {
      const card = document.getElementById('card-' + id);
      if (card) card.remove();
      if (!document.querySelector('.card')) carregar();
    } else {
      btn.disabled = false;
      btn.textContent = 'Confirmar';
    }
  };
  const s = document.createElement('script');
  s.id = 'jsonp-confreun';
  s.onerror = function() { delete window[cb]; btn.disabled = false; btn.textContent = 'Confirmar'; };
  s.src = APPS_SCRIPT_URL + '?' + params.toString() + '&callback=' + cb;
  document.head.appendChild(s);
}
</script>
</body>
</html>
