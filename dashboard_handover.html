<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visão Geral Handover , 99Abastece Relaunch SP</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root {
  --amarelo: #FFD600; --preto: #1A1A1A; --cinza-escuro: #232323; --cinza-medio: #2C2C2C;
  --branco: #FFFFFF; --texto-claro: #9A9A9A; --borda: #3A3A3A;
  --verde: #00C853; --vermelho: #FF5252; --laranja: #FFA726; --azul: #378ADD; --roxo: #7B3FE4; --radius: 10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Montserrat',sans-serif;font-size:13px;background:var(--preto);color:var(--branco);min-height:100vh;}
.topbar{background:var(--amarelo);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.topbar-brand{display:flex;align-items:center;gap:10px;}
.topbar-logo{width:34px;height:34px;background:var(--preto);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--amarelo);}
.topbar-title{font-weight:800;font-size:16px;color:var(--preto);line-height:1.1;}
.topbar-sub{font-size:11px;font-weight:600;color:rgba(0,0,0,.55);}
.topbar-voltar{background:var(--preto);color:var(--amarelo);border:none;border-radius:8px;padding:8px 14px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;cursor:pointer;text-decoration:none;}

.container{max-width:900px;margin:0 auto;padding:20px 24px 60px;}

.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
.kpi{background:var(--cinza-escuro);border-left:4px solid var(--borda);border-radius:8px;padding:14px;}
.kpi-label{font-size:9px;color:var(--texto-claro);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
.kpi-val{font-size:26px;font-weight:800;}
.kpi.vermelho{border-left-color:var(--vermelho);} .kpi.vermelho .kpi-val{color:var(--vermelho);}
.kpi.amarelo{border-left-color:var(--amarelo);} .kpi.amarelo .kpi-val{color:var(--amarelo);}
.kpi.verde{border-left-color:var(--verde);} .kpi.verde .kpi-val{color:var(--verde);}

.card{background:var(--cinza-escuro);border:1px solid var(--borda);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;}
.card-titulo{font-size:12px;font-weight:800;color:var(--branco);margin-bottom:12px;}

.barra-linha{margin-bottom:9px;}
.barra-topo{display:flex;justify-content:space-between;font-size:10px;color:var(--texto-claro);margin-bottom:3px;}
.barra-fundo{height:8px;background:var(--cinza-medio);border-radius:4px;overflow:hidden;}
.barra-preench{height:100%;border-radius:4px;}

.chart-wrap{position:relative;height:220px;}
.loading{text-align:center;padding:30px 20px;color:var(--texto-claro);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo">99</div>
    <div>
      <div class="topbar-title">Visão Geral do Handover</div>
      <div class="topbar-sub">Coordenação Nursery</div>
    </div>
  </div>
  <a class="topbar-voltar" id="link-voltar" href="hub_coordenacao.html">← Menu</a>
</div>

<div class="container">

  <div class="kpi-grid">
    <div class="kpi vermelho"><div class="kpi-label">Atrasados</div><div class="kpi-val" id="kpi-atrasados">-</div></div>
    <div class="kpi amarelo"><div class="kpi-label">Ativos</div><div class="kpi-val" id="kpi-ativos">-</div></div>
    <div class="kpi verde"><div class="kpi-label">Concluídos (mês)</div><div class="kpi-val" id="kpi-concluidos">-</div></div>
  </div>

  <div class="card">
    <div class="card-titulo">Funil — onde os postos estão parados</div>
    <div id="funil-handover"><div class="loading">Carregando...</div></div>
  </div>

  <div class="card">
    <div class="card-titulo">Handovers concluídos por semana</div>
    <div class="chart-wrap"><canvas id="chart-handovers"></canvas></div>
  </div>

</div>

<script>
const SCRIPT_URL = 'https://script.google.com/a/macros/99app.com/s/AKfycbyGDiXKWhHlEG9zMBbpg7ADTuU_Ares6xivwmSrMvFnj0689ILmisASnfgZie0botnZ0A/exec';
let chartHandovers = null;

window.onload = function() {
  const params = new URLSearchParams(window.location.search);
  const nome = params.get('nome') || '';
  document.getElementById('link-voltar').href = 'hub_coordenacao.html' + (nome ? ('?nome=' + encodeURIComponent(nome)) : '');
  carregar();
};

function carregar() {
  const cb = 'cbdashh_' + Date.now();
  window[cb] = function(data) {
    delete window[cb];
    const el = document.getElementById('jsonp-dashh');
    if (el) el.remove();
    renderizar(data || {});
  };
  const s = document.createElement('script');
  s.id = 'jsonp-dashh';
  s.onerror = function() { delete window[cb]; };
  s.src = SCRIPT_URL + '?tipo=dashboard_resumo&modo=handover&callback=' + cb + '&t=' + Date.now();
  document.head.appendChild(s);
}

function renderizar(d) {
  document.getElementById('kpi-atrasados').textContent = d.handovers_atrasados ?? '-';
  document.getElementById('kpi-ativos').textContent = d.handovers_ativos ?? '-';
  document.getElementById('kpi-concluidos').textContent = d.handovers_concluidos_mes ?? '-';

  const f = d.funil_handover || {};
  const etapas = [
    { label: 'Aguardando atribuição', val: f.aguardando_atribuicao || 0, cor: '#FFA726' },
    { label: 'Aguardando início (BD)', val: f.aguardando_inicio || 0, cor: '#FFD600' },
    { label: 'Grupo criado', val: f.grupo_criado || 0, cor: '#378ADD' },
    { label: 'Print enviado (Nursery)', val: f.print_enviado || 0, cor: '#7B3FE4' }
  ];
  const max = Math.max(...etapas.map(e => e.val), 1);
  document.getElementById('funil-handover').innerHTML = etapas.map(e => `
    <div class="barra-linha">
      <div class="barra-topo"><span>${e.label}</span><span>${e.val}</span></div>
      <div class="barra-fundo"><div class="barra-preench" style="width:${(e.val / max) * 100}%;background:${e.cor};"></div></div>
    </div>`).join('');

  const evo = d.evolucao_handovers_semana || [];
  const ctx = document.getElementById('chart-handovers').getContext('2d');
  if (chartHandovers) chartHandovers.destroy();
  chartHandovers = new Chart(ctx, {
    type: 'line',
    data: {
      labels: evo.map(x => x.semana),
      datasets: [{ label: 'Concluídos', data: evo.map(x => x.contagem), borderColor: '#00C853', backgroundColor: '#00C85322', tension: 0.35, fill: true, pointRadius: 4 }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { color: '#9A9A9A' } }, x: { ticks: { color: '#9A9A9A' } } } }
  });
}
</script>
</body>
</html>
