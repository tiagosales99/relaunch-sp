<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reuniões Agendadas , 99Abastece Relaunch SP</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --amarelo: #FFD600; --preto: #1A1A1A; --cinza-escuro: #232323; --cinza-medio: #2C2C2C;
  --branco: #FFFFFF; --texto-claro: #9A9A9A; --borda: #3A3A3A;
  --verde: #00C853; --vermelho: #FF5252; --laranja: #FFA726; --radius: 10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Montserrat',sans-serif;font-size:13px;background:var(--preto);color:var(--branco);min-height:100vh;}
.topbar{background:var(--amarelo);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.topbar-brand{display:flex;align-items:center;gap:10px;}
.topbar-logo{width:34px;height:34px;background:var(--preto);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--amarelo);}
.topbar-title{font-weight:800;font-size:16px;color:var(--preto);line-height:1.1;}
.topbar-sub{font-size:11px;font-weight:600;color:rgba(0,0,0,.55);}
.topbar-voltar{background:var(--preto);color:var(--amarelo);border:none;border-radius:8px;padding:8px 14px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;cursor:pointer;text-decoration:none;}

.container{max-width:900px;margin:0 auto;padding:20px 24px 60px;}

.card{background:var(--cinza-escuro);border:1.5px solid var(--borda);border-left:5px solid #7B3FE4;border-radius:var(--radius);padding:22px 26px;margin-bottom:16px;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
.card-posto{font-weight:800;font-size:15px;}
.card-hora{font-size:11px;font-weight:800;padding:3px 10px;border-radius:12px;background:#2A1A4D;color:#B8A8E0;white-space:nowrap;}
.card-meta{font-size:11px;color:var(--texto-claro);margin-bottom:2px;}
.card-meta b{color:var(--branco);}

.outlook-box{background:var(--cinza-medio);border:1px dashed #5C2FB8;border-radius:8px;padding:10px 14px;margin-top:12px;}
.outlook-label{font-size:10px;font-weight:700;color:#B8A8E0;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
.outlook-texto{font-size:11.5px;color:var(--texto-claro);}

.empty{text-align:center;padding:50px 20px;color:var(--texto-claro);}
.empty-icon{font-size:30px;margin-bottom:10px;}
.loading{text-align:center;padding:50px 20px;color:var(--texto-claro);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo">99</div>
    <div>
      <div class="topbar-title">Reuniões Agendadas</div>
      <div class="topbar-sub">Marcadas pela SDR pra você fechar</div>
    </div>
  </div>
  <a class="topbar-voltar" id="link-voltar" href="hub_bd.html">← Menu</a>
</div>

<div class="container">
  <div id="lista"><div class="loading">Carregando...</div></div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/a/macros/99app.com/s/AKfycbyGDiXKWhHlEG9zMBbpg7ADTuU_Ares6xivwmSrMvFnj0689ILmisASnfgZie0botnZ0A/exec';

let quemAtual = '';

window.onload = function() {
  const params = new URLSearchParams(window.location.search);
  quemAtual = params.get('nome') || '';
  document.getElementById('link-voltar').href = 'hub_bd.html' + (quemAtual ? ('?nome=' + encodeURIComponent(quemAtual)) : '');
  if (!quemAtual) {
    document.getElementById('lista').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>Acesse essa página pelo menu, faltou identificar quem você é.</div>';
    return;
  }
  carregar();
};

function formatarDataBr(dataIso) {
  const partes = String(dataIso || '').split('-');
  return partes.length === 3 ? partes[2] + '/' + partes[1] : dataIso;
}

function carregar() {
  const cb = 'cbreun_' + Date.now();
  window[cb] = function(data) {
    delete window[cb];
    const el = document.getElementById('jsonp-reun');
    if (el) el.remove();
    renderizar(Array.isArray(data) ? data : []);
  };
  const s = document.createElement('script');
  s.id = 'jsonp-reun';
  s.onerror = function() {
    delete window[cb];
    document.getElementById('lista').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>Não consegui buscar as reuniões. Tenta recarregar.</div>';
  };
  s.src = SCRIPT_URL + '?tipo=reunioes_bd&bd=' + encodeURIComponent(quemAtual) + '&callback=' + cb + '&t=' + Date.now();
  document.head.appendChild(s);
}

function renderizar(lista) {
  const container = document.getElementById('lista');
  if (!lista.length) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">✅</div>Nenhuma reunião agendada agora.</div>';
    return;
  }
  container.innerHTML = lista.map(r => `
    <div class="card">
      <div class="card-top">
        <div class="card-posto">${r.posto || 'Posto não informado'}</div>
        <div class="card-hora">${formatarDataBr(r.data)} às ${r.hora}</div>
      </div>
      <div class="card-meta">CNPJ: <b>${r.cnpj}</b></div>
      <div class="card-meta">Agendado por: <b>${r.agendado_por || '-'}</b> (SDR)</div>
      <div class="outlook-box">
        <div class="outlook-label">📅 Outlook</div>
        <div class="outlook-texto">${r.status_outlook || 'Aguardando e-mail do BPO'}${r.email_bpo ? ' · ' + r.email_bpo : ''}</div>
      </div>
    </div>`).join('');
}
</script>
</body>
</html>
