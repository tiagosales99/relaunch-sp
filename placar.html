<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placar do Mês , 99Abastece Relaunch SP</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --amarelo: #FFD600; --preto: #1A1A1A; --cinza-escuro: #232323; --cinza-medio: #2C2C2C;
  --branco: #FFFFFF; --texto-claro: #9A9A9A; --borda: #3A3A3A;
  --verde: #00C853; --vermelho: #FF5252; --azul: #378ADD; --roxo: #7B3FE4; --radius: 10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Montserrat',sans-serif;font-size:13px;background:var(--preto);color:var(--branco);min-height:100vh;}
.topbar{background:var(--amarelo);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.topbar-brand{display:flex;align-items:center;gap:10px;}
.topbar-logo{width:34px;height:34px;background:var(--preto);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--amarelo);}
.topbar-title{font-weight:800;font-size:16px;color:var(--preto);line-height:1.1;}
.topbar-sub{font-size:11px;font-weight:600;color:rgba(0,0,0,.55);}
.topbar-voltar{background:var(--preto);color:var(--amarelo);border:none;border-radius:8px;padding:8px 14px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;cursor:pointer;text-decoration:none;}
.container{max-width:560px;margin:0 auto;padding:24px;}
.item{background:var(--cinza-escuro);border:1px solid var(--borda);border-radius:12px;padding:13px 16px;display:flex;align-items:center;gap:12px;margin-bottom:9px;}
.item.voce{background:#1E2A3A;border:2px solid var(--roxo);}
.pos{font-size:13px;font-weight:800;color:var(--texto-claro);width:26px;text-align:center;}
.pos.medalha{font-size:18px;}
.nome-linha{font-size:13px;font-weight:800;color:var(--branco);}
.badge{font-size:9px;font-weight:800;padding:2px 6px;border-radius:8px;margin-left:4px;}
.badge.tc{background:var(--verde);color:#062E14;}
.badge.listagem{background:var(--azul);color:#FFFFFF;}
.badge.total{background:var(--roxo);color:#FFFFFF;}
.voce-tag{color:#B8A8E0;font-weight:600;font-size:10px;}
.barra-fundo{height:5px;background:var(--cinza-medio);border-radius:3px;overflow:hidden;margin-top:5px;}
.barra-preench{height:100%;border-radius:3px;}
.pct{font-size:14px;font-weight:800;}
.loading{text-align:center;padding:30px;color:var(--texto-claro);}
.rodape{font-size:11px;color:#6B6963;margin-top:14px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo">99</div>
    <div>
      <div class="topbar-title">Placar do Mês</div>
      <div class="topbar-sub">Ranking geral — T&C, Listagem e visão combinada</div>
    </div>
  </div>
  <a class="topbar-voltar" id="link-voltar" href="hub_bd.html">← Menu</a>
</div>

<div class="container">
  <div id="lista"><div class="loading">Carregando...</div></div>
  <div class="rodape">Cada badge mostra a métrica usada (T&C, Listagem, ou Total 50/50 no caso do Tiago) — ordenado por %, mesmo sendo metas diferentes.</div>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/a/macros/99app.com/s/AKfycbyGDiXKWhHlEG9zMBbpg7ADTuU_Ares6xivwmSrMvFnj0689ILmisASnfgZie0botnZ0A/exec';
const MEDALHAS = ['🥇', '🥈', '🥉'];

let nomeAtual = '';

window.onload = function() {
  const params = new URLSearchParams(window.location.search);
  nomeAtual = params.get('nome') || '';
  document.getElementById('link-voltar').href = 'hub_bd.html' + (nomeAtual ? ('?nome=' + encodeURIComponent(nomeAtual)) : '');
  carregar();
};

function carregar() {
  const cb = 'cbplacar_' + Date.now();
  window[cb] = function(data) {
    delete window[cb];
    const el = document.getElementById('jsonp-placar');
    if (el) el.remove();
    renderizar(data || {});
  };
  const s = document.createElement('script');
  s.id = 'jsonp-placar';
  s.onerror = function() {
    delete window[cb];
    document.getElementById('lista').innerHTML = '<div class="loading">Não consegui carregar o placar.</div>';
  };
  s.src = APPS_SCRIPT_URL + '?tipo=placar_geral&callback=' + cb + '&t=' + Date.now();
  document.head.appendChild(s);
}

function corPorPercentual(pct) {
  if (pct >= 60) return '#00C853';
  if (pct >= 30) return '#FFD600';
  return '#FF5252';
}
function badgeClasse(tipo) {
  if (tipo === 'T&C') return 'tc';
  if (tipo === 'Listagem') return 'listagem';
  return 'total';
}

function renderizar(d) {
  const container = document.getElementById('lista');
  if (!d || d.status !== 'ok' || !d.placar || !d.placar.length) {
    container.innerHTML = '<div class="loading">Sem dados de placar esse mês.</div>';
    return;
  }

  container.innerHTML = d.placar.map((item, i) => {
    const cor = corPorPercentual(item.percentual);
    const ehVoce = nomeAtual && bdCorrespondeSimples(nomeAtual, item.nome);
    const posicao = i < 3
      ? '<div class="pos medalha">' + MEDALHAS[i] + '</div>'
      : '<div class="pos">' + (i + 1) + 'º</div>';
    return `
    <div class="item${ehVoce ? ' voce' : ''}">
      ${posicao}
      <div style="flex:1;">
        <div class="nome-linha">${item.nome}${ehVoce ? ' <span class="voce-tag">(você)</span>' : ''}<span class="badge ${badgeClasse(item.tipo)}">${item.tipo}</span></div>
        <div class="barra-fundo"><div class="barra-preench" style="width:${item.percentual}%;background:${cor};"></div></div>
      </div>
      <div class="pct" style="color:${cor};">${item.percentual}%</div>
    </div>`;
  }).join('');
}

function bdCorrespondeSimples(a, b) {
  const na = String(a).toLowerCase().trim();
  const nb = String(b).toLowerCase().trim();
  return na.includes(nb) || nb.includes(na);
}
</script>
</body>
</html>
