<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Assinaturas , 99Abastece Relaunch SP</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --amarelo: #FFD600; --preto: #1A1A1A; --cinza-escuro: #232323; --cinza-medio: #2C2C2C;
  --branco: #FFFFFF; --texto-claro: #9A9A9A; --borda: #3A3A3A;
  --verde: #00C853; --vermelho: #FF5252; --laranja: #FFA726; --radius: 10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Montserrat',sans-serif;font-size:13px;background:var(--preto);color:var(--branco);min-height:100vh;}
.topbar{background:var(--amarelo);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.topbar-brand{display:flex;align-items:center;gap:10px;}
.topbar-logo{width:34px;height:34px;background:var(--preto);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--amarelo);}
.topbar-title{font-weight:800;font-size:16px;color:var(--preto);line-height:1.1;}
.topbar-sub{font-size:11px;font-weight:600;color:rgba(0,0,0,.55);}
.topbar-voltar{background:var(--preto);color:var(--amarelo);border:none;border-radius:8px;padding:8px 14px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;cursor:pointer;text-decoration:none;}

.container{max-width:1200px;margin:0 auto;padding:20px 24px 60px;}

.legenda{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.legenda-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--texto-claro);}
.legenda-bola{width:10px;height:10px;border-radius:50%;}

.lead-card{background:var(--cinza-escuro);border:1.5px solid var(--borda);border-left:5px solid var(--laranja);border-radius:var(--radius);padding:22px 26px;margin-bottom:16px;}
.lead-card.etapa-listado{border-left-color:var(--verde);}
.lead-card.etapa-deslistado, .lead-card.etapa-obsoleto{border-left-color:var(--vermelho);}
.lead-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
.lead-posto{font-weight:800;font-size:15px;}
.lead-etapa{font-size:10px;font-weight:800;padding:3px 10px;border-radius:12px;white-space:nowrap;}
.etapa-listado .lead-etapa{background:#0F2E20;color:var(--verde);}
.etapa-deslistado .lead-etapa, .etapa-obsoleto .lead-etapa{background:#3D0000;color:var(--vermelho);}
.lead-card:not(.etapa-listado):not(.etapa-deslistado):not(.etapa-obsoleto) .lead-etapa{background:#3D2A00;color:var(--laranja);}
.lead-meta{font-size:11px;color:var(--texto-claro);margin-bottom:2px;}
.lead-meta b{color:var(--branco);}

.empty{text-align:center;padding:50px 20px;color:var(--texto-claro);}
.empty-icon{font-size:30px;margin-bottom:10px;}
.loading{text-align:center;padding:50px 20px;color:var(--texto-claro);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo">99</div>
    <div>
      <div class="topbar-title">Consulta de Assinaturas</div>
      <div class="topbar-sub">Onde cada lead assinado está no funil</div>
    </div>
  </div>
  <a class="topbar-voltar" id="link-voltar" href="hub_bd.html">← Menu</a>
</div>

<div class="container">

  <div class="legenda">
    <div class="legenda-item"><span class="legenda-bola" style="background:var(--verde);"></span> Listado</div>
    <div class="legenda-item"><span class="legenda-bola" style="background:var(--laranja);"></span> Em andamento no funil</div>
    <div class="legenda-item"><span class="legenda-bola" style="background:var(--vermelho);"></span> Deslistado / Obsoleto</div>
  </div>

  <div id="lista-assinaturas"><div class="loading">Carregando...</div></div>

</div>

<script>
const SCRIPT_URL = 'https://script.google.com/a/macros/99app.com/s/AKfycbyGDiXKWhHlEG9zMBbpg7ADTuU_Ares6xivwmSrMvFnj0689ILmisASnfgZie0botnZ0A/exec';

let quemAtual = '';

window.onload = function() {
  const params = new URLSearchParams(window.location.search);
  quemAtual = params.get('nome') || '';
  document.getElementById('link-voltar').href = 'hub_bd.html' + (quemAtual ? ('?nome=' + encodeURIComponent(quemAtual)) : '');
  if (!quemAtual) {
    document.getElementById('lista-assinaturas').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>Acesse essa página pelo menu, faltou identificar quem você é.</div>';
    return;
  }
  carregarAssinaturas();
};

function classeEtapa(etapa) {
  const s = (etapa || '').toLowerCase();
  if (s.includes('11_listado')) return 'etapa-listado';
  if (s.includes('12_deslistado')) return 'etapa-deslistado';
  if (s.includes('13_lead obsoleto')) return 'etapa-obsoleto';
  return '';
}

function carregarAssinaturas() {
  const cb = 'cbassinaturas_' + Date.now();
  window[cb] = function(data) {
    delete window[cb];
    const el = document.getElementById('jsonp-assinaturas');
    if (el) el.remove();
    renderizarLista(Array.isArray(data) ? data : []);
  };
  const s = document.createElement('script');
  s.id = 'jsonp-assinaturas';
  s.onerror = function() {
    delete window[cb];
    document.getElementById('lista-assinaturas').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>Não consegui buscar os dados. Tenta recarregar a página.</div>';
  };
  s.src = SCRIPT_URL + '?tipo=meus_termos&bd=' + encodeURIComponent(quemAtual) + '&callback=' + cb + '&t=' + Date.now();
  document.head.appendChild(s);
}

function renderizarLista(leads) {
  const container = document.getElementById('lista-assinaturas');
  if (!leads.length) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">📄</div>Nenhuma assinatura encontrada esse mês.</div>';
    return;
  }
  container.innerHTML = leads.map(t => {
    const classe = classeEtapa(t.etapa_funil);
    return `
    <div class="lead-card ${classe}">
      <div class="lead-top">
        <div class="lead-posto">${t.nome_posto || 'Posto não informado'}</div>
        <div class="lead-etapa">${t.etapa_funil || 'Etapa não encontrada'}</div>
      </div>
      <div class="lead-meta">CNPJ: <b>${t.cnpj}</b></div>
      <div class="lead-meta">Assinado em: <b>${t.data_assinatura || '-'}</b> ${t.socio_assinou ? '· Sócio: <b>' + t.socio_assinou + '</b>' : ''}</div>
    </div>`;
  }).join('');
}
</script>
</body>
</html>
