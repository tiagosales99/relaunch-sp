<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pedido de Listagem</title>
<style>
  * { box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
  body { background:#1A1A1A; margin:0; padding:20px; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .topbar h1 { color:#FFD600; font-size:17px; font-weight:500; margin:0; }
  .topbar a { color:#B4B2A9; font-size:12px; text-decoration:none; }
  .card { background:#FFFFFF; border-radius:12px; padding:16px; margin-bottom:14px; max-width:420px; }
  .card-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
  .posto-nome { font-size:15px; font-weight:500; color:#1A1A1A; }
  .posto-sub { font-size:12px; color:#5F5E5A; margin-top:2px; }
  .badge { background:#FAEEDA; color:#633806; font-size:11px; font-weight:500; padding:4px 10px; border-radius:20px; white-space:nowrap; }
  .janela { display:flex; align-items:center; gap:8px; background:#F1EFE8; border-radius:8px; padding:8px 12px; margin-bottom:14px; font-size:13px; color:#2C2C2A; }
  .janela b { font-weight:500; }
  .linha-check { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-top:0.5px solid #D3D1C7; }
  .linha-check:first-child { border-top:none; }
  .label-check { font-size:13px; color:#1A1A1A; }
  .btns { display:flex; gap:6px; }
  .btn-check { font-size:12px; padding:6px 12px; border-radius:6px; border:0.5px solid #D3D1C7; background:#FFFFFF; color:#5F5E5A; cursor:pointer; }
  .btn-check.ativo-sim { border:1px solid #639922; background:#EAF3DE; color:#173404; }
  .btn-check.ativo-nao { border:1px solid #E24B4A; background:#FCEBEB; color:#501313; }
  textarea { width:100%; min-height:50px; margin-top:6px; font-size:12px; border-radius:6px; border:0.5px solid #F09595; padding:8px; background:#FCEBEB; color:#2C2C2A; display:none; }
  textarea.mostrar { display:block; }
  .btn-confirmar { width:100%; padding:10px; border-radius:8px; border:none; background:#FFD600; color:#1A1A1A; font-size:13px; font-weight:500; cursor:pointer; margin-top:12px; }
  .btn-confirmar:disabled { opacity:0.5; cursor:not-allowed; }
  .vazio { color:#B4B2A9; font-size:13px; padding:20px; text-align:center; }
  .erro { color:#F09595; font-size:12px; margin-top:6px; display:none; }
</style>
</head>
<body>
  <div class="topbar">
    <h1>Pedido de listagem</h1>
    <a href="hub_bd.html" id="link-voltar">&larr; Menu</a>
  </div>
  <div id="lista"></div>

<script>
// PREENCHER: mesma URL do Apps Script já usada nas outras telas
const APPS_SCRIPT_URL = 'https://script.google.com/a/macros/99app.com/s/AKfycbyGDiXKWhHlEG9zMBbpg7ADTuU_Ares6xivwmSrMvFnj0689ILmisASnfgZie0botnZ0A/exec';
const params = new URLSearchParams(window.location.search);
const nomeBd = params.get('nome') || '';
document.getElementById('link-voltar').href = 'hub_bd.html' + (nomeBd ? ('?nome=' + encodeURIComponent(nomeBd)) : '');

async function carregar() {
  const lista = document.getElementById('lista');
  if (!nomeBd) {
    lista.innerHTML = '<div class="vazio">⚠️ Acesse essa página pelo menu, faltou identificar quem você é.</div>';
    return;
  }
  lista.innerHTML = '<div class="vazio">Carregando...</div>';
  let dados;
  try {
    const resp = await fetch(`${APPS_SCRIPT_URL}?tipo=pedidos_listagem_aquisicao&bd=${encodeURIComponent(nomeBd)}`);
    dados = await resp.json();
  } catch (err) {
    lista.innerHTML = '<div class="vazio">⚠️ Erro ao buscar os pedidos. Recarrega a página.</div>';
    return;
  }
  lista.innerHTML = '';

  if (!dados.length) {
    lista.innerHTML = '<div class="vazio">Nenhum pedido de listagem pendente.</div>';
    return;
  }

  dados.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-head">
        <div>
          <div class="posto-nome">${p.posto}</div>
          <div class="posto-sub">${p.rede} - CNPJ ${formatarCnpj(p.cnpj)}</div>
        </div>
        <div class="badge">Aguardando você</div>
      </div>
      <div class="janela"><b>Próxima janela de subida:</b>&nbsp;${p.proxima_janela}</div>
      <div class="linha-check">
        <div class="label-check">Comprovante bancário válido enviado?</div>
        <div class="btns">
          <button class="btn-check" data-campo="comprovante" data-val="sim">Sim</button>
          <button class="btn-check" data-campo="comprovante" data-val="nao">Não</button>
        </div>
      </div>
      <div class="linha-check">
        <div class="label-check">Preço Ptarget cadastrado no webtool?</div>
        <div class="btns">
          <button class="btn-check" data-campo="ptarget" data-val="sim">Sim</button>
          <button class="btn-check" data-campo="ptarget" data-val="nao">Não</button>
        </div>
      </div>
      <textarea placeholder="Ex: alinhado preço fora de ptarget com aceite de Take Rate"></textarea>
      <div class="erro"></div>
      <button class="btn-confirmar" disabled>Confirmar pedido de listagem</button>
    `;

    const estado = { comprovante: null, ptarget: null };
    const textarea = card.querySelector('textarea');
    const erroDiv = card.querySelector('.erro');
    const btnConfirmar = card.querySelector('.btn-confirmar');

    card.querySelectorAll('.btn-check').forEach(btn => {
      btn.addEventListener('click', () => {
        const campo = btn.dataset.campo;
        const val = btn.dataset.val;
        estado[campo] = val;
        card.querySelectorAll(`.btn-check[data-campo="${campo}"]`).forEach(b => {
          b.classList.remove('ativo-sim', 'ativo-nao');
        });
        btn.classList.add(val === 'sim' ? 'ativo-sim' : 'ativo-nao');

        if (campo === 'ptarget') {
          textarea.classList.toggle('mostrar', val === 'nao');
        }
        atualizarBotao();
      });
    });

    function atualizarBotao() {
      const completo = estado.comprovante && estado.ptarget &&
        (estado.ptarget === 'sim' || (estado.ptarget === 'nao' && textarea.value.trim()));
      btnConfirmar.disabled = !completo;
    }
    textarea.addEventListener('input', atualizarBotao);

    btnConfirmar.addEventListener('click', async () => {
      erroDiv.style.display = 'none';
      btnConfirmar.disabled = true;
      btnConfirmar.textContent = 'Enviando...';
      try {
        const url = `${APPS_SCRIPT_URL}?action=confirmar_pedido_listagem&id_pedido=${encodeURIComponent(p.id_pedido)}&comprovante_bancario=${estado.comprovante}&ptarget_ok=${estado.ptarget}&observacao_ptarget=${encodeURIComponent(textarea.value.trim())}`;
        const r = await fetch(url);
        const j = await r.json();
        if (j.status === 'ok') {
          carregar();
        } else {
          erroDiv.textContent = j.msg || 'Erro ao confirmar';
          erroDiv.style.display = 'block';
          btnConfirmar.disabled = false;
          btnConfirmar.textContent = 'Confirmar pedido de listagem';
        }
      } catch (err) {
        erroDiv.textContent = 'Erro de conexão. Tente novamente.';
        erroDiv.style.display = 'block';
        btnConfirmar.disabled = false;
        btnConfirmar.textContent = 'Confirmar pedido de listagem';
      }
    });

    lista.appendChild(card);
  });
}

function formatarCnpj(c) {
  const s = String(c).replace(/\D/g,'').padStart(14,'0');
  return s.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');
}

carregar();
</script>
</body>
</html>
