<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus Termos , 99Abastece Relaunch SP</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --amarelo: #FFD600; --preto: #1A1A1A; --cinza-escuro: #232323; --cinza-medio: #2C2C2C;
  --branco: #FFFFFF; --texto-claro: #9A9A9A; --borda: #3A3A3A;
  --verde: #00C853; --vermelho: #FF5252; --laranja: #FFA726; --radius: 10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Montserrat',sans-serif;font-size:13px;background:var(--preto);color:var(--branco);min-height:100vh;}
.topbar{background:var(--amarelo);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.topbar-brand{display:flex;align-items:center;gap:10px;}
.topbar-logo{width:34px;height:34px;background:var(--preto);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--amarelo);}
.topbar-title{font-weight:800;font-size:16px;color:var(--preto);line-height:1.1;}
.topbar-sub{font-size:11px;font-weight:600;color:rgba(0,0,0,.55);}
.topbar-voltar{background:var(--preto);color:var(--amarelo);border:none;border-radius:8px;padding:8px 14px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;cursor:pointer;text-decoration:none;}

.container{max-width:1200px;margin:0 auto;padding:20px 24px 60px;}

.meta-hoje{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.meta-card{flex:1;min-width:140px;background:var(--cinza-escuro);border:1.5px solid var(--borda);border-radius:var(--radius);padding:14px 16px;text-align:center;}
.meta-label{font-size:10px;font-weight:700;color:var(--texto-claro);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
.meta-valor{font-size:24px;font-weight:800;color:var(--amarelo);}

.termo-card{background:var(--cinza-escuro);border:1.5px solid var(--borda);border-left:5px solid var(--verde);border-radius:var(--radius);padding:22px 26px;margin-bottom:16px;}
.termo-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
.termo-posto{font-weight:800;font-size:15px;}
.termo-data{font-size:11px;font-weight:800;padding:3px 10px;border-radius:12px;background:#0F2E20;color:var(--verde);white-space:nowrap;}
.termo-meta{font-size:11px;color:var(--texto-claro);margin-bottom:2px;}
.termo-meta b{color:var(--branco);}
.termo-forms{display:inline-block;margin-top:10px;font-size:11px;font-weight:700;padding:6px 12px;border-radius:8px;background:var(--cinza-medio);}

.empty{text-align:center;padding:50px 20px;color:var(--texto-claro);}
.empty-icon{font-size:30px;margin-bottom:10px;}
.loading{text-align:center;padding:50px 20px;color:var(--texto-claro);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo">99</div>
    <div>
      <div class="topbar-title">Meus Termos</div>
      <div class="topbar-sub">Contratos assinados</div>
    </div>
  </div>
  <a class="topbar-voltar" id="link-voltar" href="hub_bd.html">← Menu</a>
</div>

<div class="container">

  <div class="meta-hoje">
    <div class="meta-card"><div class="meta-label">Termos assinados</div><div class="meta-valor" id="meta-total">-</div></div>
  </div>

  <div id="lista-termos"><div class="loading">Carregando termos...</div></div>

</div>

<script>
const SCRIPT_URL = 'https://script.google.com/a/macros/99app.com/s/AKfycbyGDiXKWhHlEG9zMBbpg7ADTuU_Ares6xivwmSrMvFnj0689ILmisASnfgZie0botnZ0A/exec';

let quemAtual = '';

window.onload = function() {
  const params = new URLSearchParams(window.location.search);
  quemAtual = params.get('nome') || '';
  document.getElementById('link-voltar').href = 'hub_bd.html' + (quemAtual ? ('?nome=' + encodeURIComponent(quemAtual)) : '');
  if (!quemAtual) {
    document.getElementById('lista-termos').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>Acesse essa página pelo menu, faltou identificar quem você é.</div>';
    return;
  }
  carregarTermos();
};

function carregarTermos() {
  const cb = 'cbtermos_' + Date.now();
  window[cb] = function(data) {
    delete window[cb];
    const el = document.getElementById('jsonp-termos');
    if (el) el.remove();
    const termos = Array.isArray(data) ? data : [];
    document.getElementById('meta-total').textContent = termos.length;
    renderizarLista(termos);
  };
  const s = document.createElement('script');
  s.id = 'jsonp-termos';
  s.onerror = function() {
    delete window[cb];
    document.getElementById('lista-termos').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>Não consegui buscar os termos. Tenta recarregar a página.</div>';
  };
  s.src = SCRIPT_URL + '?tipo=meus_termos&bd=' + encodeURIComponent(quemAtual) + '&callback=' + cb + '&t=' + Date.now();
  document.head.appendChild(s);
}

function renderizarLista(termos) {
  const container = document.getElementById('lista-termos');
  if (!termos.length) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">📄</div>Nenhum termo assinado encontrado esse mês.</div>';
    return;
  }
  container.innerHTML = termos.map(t => `
    <div class="termo-card">
      <div class="termo-top">
        <div class="termo-posto">${t.nome_posto || 'Posto não informado'}</div>
        <div class="termo-data">Assinado em ${t.data_assinatura || '-'}</div>
      </div>
      <div class="termo-meta">CNPJ: <b>${t.cnpj}</b> ${t.rede ? '· Rede: <b>' + t.rede + '</b>' : ''}</div>
      <div class="termo-meta">Prioridade: <b>${t.prioridade || '-'}</b> ${t.wave ? '· ' + t.wave : ''}</div>
      ${t.socio_assinou ? `<div class="termo-meta">Sócio que assinou: <b>${t.socio_assinou}</b></div>` : ''}
      ${t.etapa_funil ? `<div class="termo-meta">Etapa atual no funil: <b>${t.etapa_funil}</b></div>` : ''}
      <div class="termo-forms">${t.forms_status || 'Sem status de Forms'}</div>
    </div>`).join('');
}
</script>
</body>
</html>
