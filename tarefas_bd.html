<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minhas Tarefas , 99Abastece Relaunch SP</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --amarelo: #FFD600; --preto: #1A1A1A; --cinza-escuro: #232323; --cinza-medio: #2C2C2C;
  --branco: #FFFFFF; --texto-claro: #9A9A9A; --borda: #3A3A3A;
  --verde: #00C853; --vermelho: #FF5252; --laranja: #FFA726; --radius: 10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Montserrat',sans-serif;font-size:13px;background:var(--preto);color:var(--branco);min-height:100vh;}
body.travado{overflow:hidden;}
.topbar{background:var(--amarelo);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.topbar-brand{display:flex;align-items:center;gap:10px;}
.topbar-logo{width:34px;height:34px;background:var(--preto);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--amarelo);}
.topbar-title{font-weight:800;font-size:16px;color:var(--preto);line-height:1.1;}
.topbar-sub{font-size:11px;font-weight:600;color:rgba(0,0,0,.55);}
.topbar-voltar{background:var(--preto);color:var(--amarelo);border:none;border-radius:8px;padding:8px 14px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;cursor:pointer;text-decoration:none;}

.container{max-width:1200px;margin:0 auto;padding:20px 24px 60px;}

.meta-hoje{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.meta-card{flex:1;min-width:140px;background:var(--cinza-escuro);border:1.5px solid var(--borda);border-radius:var(--radius);padding:14px 16px;text-align:center;}
.meta-label{font-size:10px;font-weight:700;color:var(--texto-claro);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
.meta-valor{font-size:24px;font-weight:800;color:var(--amarelo);}
.meta-card.atrasadas .meta-valor{color:var(--vermelho);}
.meta-card.vencendo .meta-valor{color:var(--laranja);}

.tarefa-card{background:var(--cinza-escuro);border:1.5px solid var(--borda);border-left:5px solid var(--laranja);border-radius:var(--radius);padding:22px 26px;margin-bottom:16px;}
.tarefa-card.pri-alta{border-left-color:var(--vermelho);}
.tarefa-card.pri-media{border-left-color:var(--laranja);}
.tarefa-card.pri-baixa{border-left-color:var(--verde);}
.tarefa-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
.tarefa-posto{font-weight:800;font-size:15px;}
.tarefa-prio{font-size:10px;font-weight:800;padding:3px 10px;border-radius:12px;white-space:nowrap;}
.pri-alta .tarefa-prio{background:#3D0000;color:var(--vermelho);}
.pri-media .tarefa-prio{background:#3D2A00;color:var(--laranja);}
.pri-baixa .tarefa-prio{background:#0F2E20;color:var(--verde);}
.tarefa-meta{font-size:11px;color:var(--texto-claro);margin-bottom:2px;}
.tarefa-meta b{color:var(--branco);}
.tarefa-desc{margin:10px 0;font-size:13px;font-weight:600;background:var(--cinza-medio);border-radius:8px;padding:10px 12px;}
.tarefa-prazo{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;}
.prazo-ok{color:var(--texto-claro);}
.prazo-vencendo{color:var(--laranja);}
.prazo-atrasada{color:var(--vermelho);}
.btn-concluir{margin-top:14px;width:100%;background:var(--amarelo);color:var(--preto);border:none;border-radius:8px;padding:11px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:12.5px;cursor:pointer;}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:100;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
.modal-overlay.show{display:flex;}
.modal-card{background:var(--cinza-escuro);border:2px solid var(--amarelo);border-radius:14px;padding:26px 30px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,0.6);}
.modal-fechar{float:right;font-size:18px;color:var(--texto-claro);cursor:pointer;background:none;border:none;line-height:1;}
.modal-card label{display:block;font-size:11px;font-weight:700;color:var(--texto-claro);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;margin-top:14px;}
.modal-card textarea{width:100%;background:var(--cinza-medio);border:1.5px solid var(--borda);border-radius:8px;color:var(--branco);font-family:'Montserrat',sans-serif;font-size:13px;padding:9px 12px;outline:none;resize:vertical;min-height:80px;}
.btn-salvar{margin-top:16px;width:100%;background:var(--amarelo);color:var(--preto);border:none;border-radius:8px;padding:10px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:12px;cursor:pointer;}
.btn-cancelar{margin-top:6px;width:100%;background:none;color:var(--texto-claro);border:none;padding:6px;font-family:'Montserrat',sans-serif;font-size:11px;cursor:pointer;}

.empty{text-align:center;padding:50px 20px;color:var(--texto-claro);}
.empty-icon{font-size:30px;margin-bottom:10px;}
.loading{text-align:center;padding:50px 20px;color:var(--texto-claro);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo">99</div>
    <div>
      <div class="topbar-title">Minhas Tarefas</div>
      <div class="topbar-sub">Geradas automaticamente pelas suas visitas</div>
    </div>
  </div>
  <a class="topbar-voltar" id="link-voltar" href="hub_bd.html">← Menu</a>
</div>

<div class="container">

  <div class="meta-hoje">
    <div class="meta-card"><div class="meta-label">Pendentes</div><div class="meta-valor" id="meta-pendentes">-</div></div>
    <div class="meta-card atrasadas"><div class="meta-label">Atrasadas</div><div class="meta-valor" id="meta-atrasadas">-</div></div>
    <div class="meta-card vencendo"><div class="meta-label">Vencendo em 2 dias</div><div class="meta-valor" id="meta-vencendo">-</div></div>
  </div>

  <div id="lista-tarefas"><div class="loading">Carregando tarefas...</div></div>

</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-card" id="modal-card"></div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/a/macros/99app.com/s/AKfycbyGDiXKWhHlEG9zMBbpg7ADTuU_Ares6xivwmSrMvFnj0689ILmisASnfgZie0botnZ0A/exec';

let tarefasAtuais = [];
let quemAtual = '';

window.onload = function() {
  const params = new URLSearchParams(window.location.search);
  quemAtual = params.get('nome') || '';
  document.getElementById('link-voltar').href = 'hub_bd.html' + (quemAtual ? ('?nome=' + encodeURIComponent(quemAtual)) : '');
  if (!quemAtual) {
    document.getElementById('lista-tarefas').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>Acesse essa página pelo menu, faltou identificar quem você é.</div>';
    return;
  }
  carregarTarefas();
};

function prioridadeClasse(p) {
  const s = (p || '').toLowerCase();
  if (s === 'alta') return 'pri-alta';
  if (s === 'média' || s === 'media') return 'pri-media';
  return 'pri-baixa';
}

async function carregarTarefas() {
  document.getElementById('lista-tarefas').innerHTML = '<div class="loading">Carregando tarefas...</div>';
  try {
    const resposta = await fetch(SCRIPT_URL + '?bd=' + encodeURIComponent(quemAtual) + '&t=' + Date.now());
    const data = await resposta.json();
    tarefasAtuais = (Array.isArray(data) ? data : []).filter(t => t.status_tarefa === 'Pendente');
    renderizarMeta();
    renderizarLista();
  } catch (err) {
    document.getElementById('lista-tarefas').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>Não consegui buscar as tarefas. Tenta recarregar a página.</div>';
  }
}

function renderizarMeta() {
  document.getElementById('meta-pendentes').textContent = tarefasAtuais.length;
  document.getElementById('meta-atrasadas').textContent = tarefasAtuais.filter(t => t.atrasada === true || t.atrasada === 'true').length;
  document.getElementById('meta-vencendo').textContent = tarefasAtuais.filter(t => t.vencendo_hoje === true || t.vencendo_hoje === 'true').length;
}

function ordemPrioridade(p) {
  const s = (p || '').toLowerCase();
  if (s === 'alta') return 0;
  if (s === 'média' || s === 'media') return 1;
  return 2;
}

function renderizarLista() {
  const container = document.getElementById('lista-tarefas');
  if (!tarefasAtuais.length) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">✅</div>Nenhuma tarefa pendente agora.</div>';
    return;
  }

  const ordenada = [...tarefasAtuais].sort((a,b) => {
    const atrasadaA = a.atrasada === true || a.atrasada === 'true';
    const atrasadaB = b.atrasada === true || b.atrasada === 'true';
    if (atrasadaA !== atrasadaB) return atrasadaA ? -1 : 1;
    return ordemPrioridade(a.prioridade) - ordemPrioridade(b.prioridade);
  });

  container.innerHTML = ordenada.map(t => {
    const classePri = prioridadeClasse(t.prioridade);
    const atrasada = t.atrasada === true || t.atrasada === 'true';
    const vencendo = t.vencendo_hoje === true || t.vencendo_hoje === 'true';
    let prazoTexto = 'Prazo: ' + (t.prazo || '-');
    let classePrazo = 'prazo-ok';
    if (atrasada) { prazoTexto = 'Atrasada — prazo era ' + (t.prazo || '-'); classePrazo = 'prazo-atrasada'; }
    else if (vencendo) { prazoTexto = 'Vencendo — prazo ' + (t.prazo || '-'); classePrazo = 'prazo-vencendo'; }

    return `
    <div class="tarefa-card ${classePri}" id="card-${t.id_tarefa}">
      <div class="tarefa-top">
        <div class="tarefa-posto">${t.posto || 'Posto não informado'}</div>
        <div class="tarefa-prio">${t.prioridade || '-'}</div>
      </div>
      <div class="tarefa-meta">CNPJ: <b>${t.cnpj}</b></div>
      <div class="tarefa-meta">Status da visita: <b>${t.status_visita || '-'}</b></div>
      <div class="tarefa-desc">${t.tarefa || ''}</div>
      <span class="tarefa-prazo ${classePrazo}">${prazoTexto}</span>
      <button class="btn-concluir" onclick="abrirConcluir('${t.id_tarefa}')">✓ Marcar como concluída</button>
    </div>`;
  }).join('');
}

function abrirConcluir(id) {
  const t = tarefasAtuais.find(x => x.id_tarefa === id);
  if (!t) return;

  document.getElementById('modal-card').innerHTML = `
    <button class="modal-fechar" onclick="fecharModal()">✕</button>
    <div class="tarefa-posto">${t.posto || 'Posto não informado'}</div>
    <div class="tarefa-meta">CNPJ: <b>${t.cnpj}</b></div>
    <div class="tarefa-desc">${t.tarefa || ''}</div>
    <label>O que foi feito? (opcional)</label>
    <textarea id="obs-conclusao" placeholder="Ex: Liguei e agendei retorno pra próxima semana."></textarea>
    <button class="btn-salvar" onclick="salvarConclusao('${id}')">Confirmar conclusão</button>
    <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
  `;
  document.getElementById('modal-overlay').classList.add('show');
  document.body.classList.add('travado');
}

function fecharModal() {
  document.getElementById('modal-overlay').classList.remove('show');
  document.getElementById('modal-card').innerHTML = '';
  document.body.classList.remove('travado');
}

async function salvarConclusao(id) {
  const obs = document.getElementById('obs-conclusao').value.trim();
  const params = new URLSearchParams({ action: 'concluir', id_tarefa: id, observacao: obs });
  try {
    const resposta = await fetch(SCRIPT_URL + '?' + params.toString());
    const resultado = await resposta.json();
    if (!resultado || resultado.status !== 'ok') { alert('Erro ao concluir. Tenta de novo.'); return; }
    tarefasAtuais = tarefasAtuais.filter(t => t.id_tarefa !== id);
    renderizarMeta();
    renderizarLista();
    fecharModal();
  } catch (err) {
    alert('Erro ao concluir. Tenta de novo.');
  }
}
</script>
</body>
</html>
