<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relaunch SP , 99Abastece</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --amarelo: #FFD600; --preto: #1A1A1A; --cinza-escuro: #232323; --cinza-medio: #2C2C2C;
  --branco: #FFFFFF; --texto-claro: #9A9A9A; --borda: #3A3A3A; --vermelho: #FF5252; --radius: 12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Montserrat',sans-serif;background:var(--preto);color:var(--branco);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px;}
.topo{text-align:center;margin-bottom:36px;}
.logo{width:52px;height:52px;background:var(--amarelo);border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:var(--preto);margin:0 auto 14px;}
.titulo{font-weight:800;font-size:20px;}
.subtitulo{font-size:12px;color:var(--texto-claro);margin-top:4px;}

.cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;max-width:900px;width:100%;}
.card{background:var(--cinza-escuro);border:1.5px solid var(--borda);border-radius:var(--radius);padding:24px;width:260px;text-align:center;transition:border-color .2s;}
.card.aberto{border-color:var(--amarelo);}
.card-icone{color:var(--amarelo);margin-bottom:10px;display:flex;justify-content:center;}
.card-titulo{font-weight:800;font-size:16px;margin-bottom:4px;}
.card-desc{font-size:11px;color:var(--texto-claro);margin-bottom:16px;}
.form-login{text-align:left;}
.card-abrir{width:100%;background:var(--cinza-medio);border:1.5px solid var(--borda);color:var(--branco);border-radius:8px;padding:10px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;cursor:pointer;}
.card.aberto .card-abrir{display:none;}

.form-login{display:none;margin-top:16px;}
.form-login.show{display:block;}
.form-login label{display:block;font-size:10px;font-weight:700;color:var(--texto-claro);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;margin-top:10px;}
.form-login select, .form-login input{width:100%;background:var(--cinza-medio);border:1.5px solid var(--borda);border-radius:8px;color:var(--branco);font-family:'Montserrat',sans-serif;font-size:13px;padding:9px 10px;}
.btn-entrar{width:100%;margin-top:14px;background:var(--amarelo);color:var(--preto);border:none;border-radius:8px;padding:10px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:12px;cursor:pointer;}
.erro-login{font-size:11px;color:var(--vermelho);margin-top:8px;display:none;}
</style>
</head>
<body>

<div class="topo">
  <div class="logo">99</div>
  <div class="titulo">Relaunch SP</div>
  <div class="subtitulo">Selecione seu acesso</div>
</div>

<div class="cards">

  <div class="card" id="card-SDR">
    <div class="card-icone"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></div>
    <div class="card-titulo">BD SDR</div>
    <div class="card-desc">Fila de revisita de leads travados</div>
    <button class="card-abrir" onclick="abrirCard('SDR')">Entrar</button>
    <div class="form-login" id="form-SDR">
      <label>Quem é você?</label>
      <select id="nome-SDR">
        <option value="">Selecione</option>
        <option value="Bruno">Bruno</option>
        <option value="Carlos Barboza">Carlos Barboza</option>
      </select>
      <label>Senha</label>
      <input type="password" id="senha-SDR">
      <button class="btn-entrar" onclick="entrar('SDR')">Entrar</button>
      <div class="erro-login" id="erro-SDR">Usuário ou senha incorretos.</div>
    </div>
  </div>

  <div class="card" id="card-BD">
    <div class="card-icone"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M14.5 4.5a2.121 2.121 0 0 1 3 3L7 18l-4 1 1-4Z"/></svg></div>
    <div class="card-titulo">BD Aquisição</div>
    <div class="card-desc">Visitas, tarefas e reporte diário</div>
    <button class="card-abrir" onclick="abrirCard('BD')">Entrar</button>
    <div class="form-login" id="form-BD">
      <label>Quem é você?</label>
      <select id="nome-BD">
        <option value="">Selecione</option>
        <option value="Felipe">Felipe</option>
        <option value="Inacio">Inacio</option>
        <option value="Andre">Andre</option>
        <option value="Sutil">Sutil</option>
        <option value="Vera">Vera</option>
        <option value="Fred">Fred</option>
      </select>
      <label>Senha</label>
      <input type="password" id="senha-BD">
      <button class="btn-entrar" onclick="entrar('BD')">Entrar</button>
      <div class="erro-login" id="erro-BD">Usuário ou senha incorretos.</div>
    </div>
  </div>

  <div class="card" id="card-GERENCIAL">
    <div class="card-icone"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg></div>
    <div class="card-titulo">Dash Gerencial</div>
    <div class="card-desc">Visão consolidada do time</div>
    <button class="card-abrir" onclick="abrirCard('GERENCIAL')">Entrar</button>
    <div class="form-login" id="form-GERENCIAL">
      <label>Quem é você?</label>
      <select id="nome-GERENCIAL">
        <option value="">Selecione</option>
        <option value="Tiago">Tiago</option>
      </select>
      <label>Senha</label>
      <input type="password" id="senha-GERENCIAL">
      <button class="btn-entrar" onclick="entrar('GERENCIAL')">Entrar</button>
      <div class="erro-login" id="erro-GERENCIAL">Usuário ou senha incorretos.</div>
    </div>
  </div>

</div>

<script>
const SCRIPT_URL = 'https://script.google.com/a/macros/99app.com/s/AKfycbyGDiXKWhHlEG9zMBbpg7ADTuU_Ares6xivwmSrMvFnj0689ILmisASnfgZie0botnZ0A/exec';

const DESTINOS = {
  'SDR': 'painel_revisita.html',
  'BD': 'hub_bd.html',
  'GERENCIAL': 'dashboard_relaunch.html'
};

// O login usa nomes curtos (aba Usuarios), mas o Forms W_2 e a aba Tarefas
// usam o nome completo (mesmas opções do dropdown "Qual seu nome?" do
// Forms). Sem esse mapa, as telas do BD (registrar visita, tarefas) não
// batem o nome e ficam vazias/bloqueadas.
const NOME_COMPLETO_BD = {
  'Felipe': 'Felipe Borges',
  'Inacio': 'Inácio',
  'Andre': 'André Silva',
  'Sutil': 'Carlos Sutil',
  'Vera': 'Vera Souza'
};

function abrirCard(papel) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('aberto'));
  document.querySelectorAll('.form-login').forEach(f => f.classList.remove('show'));
  document.getElementById('card-' + papel).classList.add('aberto');
  document.getElementById('form-' + papel).classList.add('show');
}

function entrar(papel) {
  const nome = document.getElementById('nome-' + papel).value;
  const senha = document.getElementById('senha-' + papel).value;
  const erroEl = document.getElementById('erro-' + papel);
  erroEl.style.display = 'none';

  if (!nome || !senha) { erroEl.textContent = 'Selecione seu nome e digite a senha.'; erroEl.style.display = 'block'; return; }

  const params = new URLSearchParams({ action: 'login', nome, senha, papel });
  const cb = 'cblogin_' + Date.now();
  window[cb] = function(resultado) {
    delete window[cb];
    const el = document.getElementById('jsonp-login');
    if (el) el.remove();
    if (!resultado || resultado.status !== 'ok') {
      erroEl.textContent = 'Usuário ou senha incorretos.';
      erroEl.style.display = 'block';
      return;
    }
    window.location.href = DESTINOS[papel] + '?nome=' + encodeURIComponent(NOME_COMPLETO_BD[resultado.nome] || resultado.nome);
  };
  const s = document.createElement('script');
  s.id = 'jsonp-login';
  s.onerror = function() {
    delete window[cb];
    erroEl.textContent = 'Erro ao conectar. Tenta de novo.';
    erroEl.style.display = 'block';
  };
  s.src = SCRIPT_URL + '?' + params.toString() + '&callback=' + cb;
  document.head.appendChild(s);
}
</script>
</body>
</html>
