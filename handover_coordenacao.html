<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atribuir Handovers , 99Abastece Relaunch SP</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --amarelo: #FFD600; --preto: #1A1A1A; --cinza-escuro: #232323; --cinza-medio: #2C2C2C;
  --branco: #FFFFFF; --texto-claro: #9A9A9A; --borda: #3A3A3A;
  --verde: #00C853; --vermelho: #FF5252; --laranja: #FFA726; --radius: 10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Montserrat',sans-serif;font-size:13px;background:var(--preto);color:var(--branco);min-height:100vh;}
.topbar{background:var(--amarelo);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.topbar-brand{display:flex;align-items:center;gap:10px;}
.topbar-logo{width:34px;height:34px;background:var(--preto);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--amarelo);}
.topbar-title{font-weight:800;font-size:16px;color:var(--preto);line-height:1.1;}
.topbar-sub{font-size:11px;font-weight:600;color:rgba(0,0,0,.55);}
.topbar-voltar{background:var(--preto);color:var(--amarelo);border:none;border-radius:8px;padding:8px 14px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;cursor:pointer;text-decoration:none;}

.container{max-width:900px;margin:0 auto;padding:20px 24px 60px;}

.card{background:var(--cinza-escuro);border:1.5px solid var(--borda);border-left:5px solid var(--amarelo);border-radius:var(--radius);padding:22px 26px;margin-bottom:16px;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
.card-posto{font-weight:800;font-size:15px;}
.card-meta{font-size:11px;color:var(--texto-claro);margin-bottom:2px;}
.card-meta b{color:var(--branco);}

.atribuir-row{display:flex;gap:10px;margin-top:14px;}
.atribuir-row select{flex:1;background:var(--cinza-medio);border:1.5px solid var(--borda);border-radius:8px;color:var(--branco);font-family:'Montserrat',sans-serif;font-size:13px;padding:10px 12px;}
.atribuir-row button{background:var(--amarelo);color:var(--preto);border:none;border-radius:8px;padding:0 20px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:12px;cursor:pointer;}
.atribuir-row button:disabled{opacity:.5;cursor:not-allowed;}

.tarefa-fernanda{background:var(--cinza-escuro);border:1.5px solid var(--vermelho);border-left:5px solid var(--vermelho);border-radius:var(--radius);padding:16px 20px;margin-bottom:14px;}
.tarefa-fernanda-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}
.tarefa-fernanda-titulo{font-weight:800;font-size:14px;color:#FFFFFF;}
.tarefa-fernanda-tag{font-size:10px;font-weight:800;padding:3px 10px;border-radius:12px;background:#3D0000;color:var(--vermelho);white-space:nowrap;}
.tarefa-fernanda-desc{font-size:12px;color:#FF8A8A;margin-bottom:10px;}
.tarefa-fernanda-meta{font-size:11px;color:var(--texto-claro);margin-bottom:2px;}
.btn-concluir-tarefa{width:100%;margin-top:10px;background:var(--amarelo);color:var(--preto);border:none;border-radius:8px;padding:9px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;cursor:pointer;}

.empty{text-align:center;padding:50px 20px;color:var(--texto-claro);}
.empty-icon{font-size:30px;margin-bottom:10px;}
.loading{text-align:center;padding:50px 20px;color:var(--texto-claro);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo">99</div>
    <div>
      <div class="topbar-title">Atribuir Handovers</div>
      <div class="topbar-sub">Defina qual Nursery assume cada posto</div>
    </div>
  </div>
  <a class="topbar-voltar" id="link-voltar" href="hub_nursery.html">← Menu</a>
</div>

<div class="container">
  <div id="minhas-tarefas"></div>
  <div id="lista"><div class="loading">Carregando...</div></div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/a/macros/99app.com/s/AKfycbyGDiXKWhHlEG9zMBbpg7ADTuU_Ares6xivwmSrMvFnj0689ILmisASnfgZie0botnZ0A/exec';
const NURSERY_BDS = ['Matheus', 'Everton', 'Erik', 'Mainart'];

let quemAtual = '';

window.onload = function() {
  const params = new URLSearchParams(window.location.search);
  quemAtual = params.get('nome') || '';
  document.getElementById('link-voltar').href = 'hub_nursery.html' + (quemAtual ? ('?nome=' + encodeURIComponent(quemAtual)) : '');
  carregar();
  carregarMinhasTarefas();
};

// ── TAREFAS DA FERNANDA (ex: BD Engajamento faltando) ────────────
function carregarMinhasTarefas() {
  const cb = 'cbtaref_' + Date.now();
  window[cb] = function(data) {
    delete window[cb];
    const el = document.getElementById('jsonp-taref');
    if (el) el.remove();
    const pendentes = (Array.isArray(data) ? data : []).filter(t => t.status_tarefa === 'Pendente');
    renderizarMinhasTarefas(pendentes);
  };
  const s = document.createElement('script');
  s.id = 'jsonp-taref';
  s.onerror = function() { delete window[cb]; };
  s.src = SCRIPT_URL + '?bd=' + encodeURIComponent(quemAtual || 'Fernanda') + '&callback=' + cb + '&t=' + Date.now();
  document.head.appendChild(s);
}

function renderizarMinhasTarefas(lista) {
  const container = document.getElementById('minhas-tarefas');
  if (!lista.length) { container.innerHTML = ''; return; }
  container.innerHTML = lista.map(t => `
    <div class="tarefa-fernanda" id="tarefa-${t.id_tarefa}">
      <div class="tarefa-fernanda-top">
        <div class="tarefa-fernanda-titulo">${t.posto || 'Posto não informado'}</div>
        <div class="tarefa-fernanda-tag">${t.prioridade || '-'}</div>
      </div>
      <div class="tarefa-fernanda-desc">${t.tarefa || ''}</div>
      <div class="tarefa-fernanda-meta">CNPJ: <b>${t.cnpj}</b> · Prazo: ${t.prazo || '-'}</div>
      <button class="btn-concluir-tarefa" onclick="concluirMinhaTarefa('${t.id_tarefa}')">✓ Já resolvi</button>
    </div>`).join('');
}

function concluirMinhaTarefa(id) {
  const params = new URLSearchParams({ action: 'concluir', id_tarefa: id });
  const cb = 'cbconctar_' + Date.now();
  window[cb] = function(resultado) {
    delete window[cb];
    const el = document.getElementById('jsonp-conctar');
    if (el) el.remove();
    if (!resultado || resultado.status !== 'ok') { alert('Erro ao concluir. Tenta de novo.'); return; }
    const card = document.getElementById('tarefa-' + id);
    if (card) card.remove();
  };
  const s = document.createElement('script');
  s.id = 'jsonp-conctar';
  s.onerror = function() { delete window[cb]; alert('Erro ao concluir. Tenta de novo.'); };
  s.src = SCRIPT_URL + '?' + params.toString() + '&callback=' + cb;
  document.head.appendChild(s);
}

function carregar() {
  const cb = 'cbatrib_' + Date.now();
  window[cb] = function(data) {
    delete window[cb];
    const el = document.getElementById('jsonp-atrib');
    if (el) el.remove();
    renderizar(Array.isArray(data) ? data : []);
  };
  const s = document.createElement('script');
  s.id = 'jsonp-atrib';
  s.onerror = function() {
    delete window[cb];
    document.getElementById('lista').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>Não consegui buscar os handovers. Tenta recarregar.</div>';
  };
  s.src = SCRIPT_URL + '?tipo=handovers_atribuicao&callback=' + cb + '&t=' + Date.now();
  document.head.appendChild(s);
}

function renderizar(lista) {
  const container = document.getElementById('lista');
  if (!lista.length) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">✅</div>Nenhum handover aguardando atribuição agora.</div>';
    return;
  }
  container.innerHTML = lista.map(h => `
    <div class="card" id="card-${h.id_handover}">
      <div class="card-top">
        <div class="card-posto">${h.posto || 'Posto não informado'}</div>
      </div>
      <div class="card-meta">CNPJ: <b>${h.cnpj}</b></div>
      <div class="card-meta">BD de Aquisição: <b>${h.bd_aquisicao || '-'}</b></div>
      <div class="card-meta">Listado em: <b>${h.data_criacao || '-'}</b></div>
      <div class="atribuir-row">
        <select id="select-${h.id_handover}">
          <option value="">Escolher Nursery</option>
          ${NURSERY_BDS.map(n => `<option value="${n}">${n}</option>`).join('')}
        </select>
        <button id="btn-${h.id_handover}" onclick="atribuir('${h.id_handover}')">Atribuir</button>
      </div>
    </div>`).join('');
}

function atribuir(id) {
  const select = document.getElementById('select-' + id);
  const nursery = select.value;
  if (!nursery) { alert('Escolhe quem vai assumir antes de atribuir.'); return; }

  const btn = document.getElementById('btn-' + id);
  btn.disabled = true;
  btn.textContent = 'Atribuindo...';

  const params = new URLSearchParams({ action: 'atribuir_nursery', id_handover: id, bd_nursery: nursery });
  const cb = 'cbatribuir_' + Date.now();
  window[cb] = function(resultado) {
    delete window[cb];
    const el = document.getElementById('jsonp-atribuir');
    if (el) el.remove();
    if (!resultado || resultado.status !== 'ok') {
      alert('Erro ao atribuir. Tenta de novo.');
      btn.disabled = false;
      btn.textContent = 'Atribuir';
      return;
    }
    const card = document.getElementById('card-' + id);
    if (card) card.remove();
  };
  const s = document.createElement('script');
  s.id = 'jsonp-atribuir';
  s.onerror = function() { delete window[cb]; alert('Erro ao atribuir. Tenta de novo.'); btn.disabled = false; btn.textContent = 'Atribuir'; };
  s.src = SCRIPT_URL + '?' + params.toString() + '&callback=' + cb;
  document.head.appendChild(s);
}
</script>
</body>
</html>
